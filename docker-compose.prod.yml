# =============================================================
# UMBRAL — Producción (VPS Contabo + Caddy)
# Sin puertos publicados: Caddy entra por la red "proxy".
# =============================================================
services:
  umbral_postgres:
    image: postgres:16-alpine
    container_name: umbral_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - umbral_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - umbral_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  umbral_redis:
    image: redis:7-alpine
    container_name: umbral_redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - umbral_redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - umbral_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  umbral_backend:
    # PHP-FPM + opcache (S10). nginx (umbral_frontend) le habla por el puerto 9000 de la red interna.
    build:
      context: ./docker/backend
      dockerfile: Dockerfile.prod
    container_name: umbral_backend
    restart: unless-stopped
    depends_on:
      umbral_postgres:
        condition: service_healthy
      umbral_redis:
        condition: service_healthy
    environment:
      DB_HOST: umbral_postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: prefer
      REDIS_HOST: umbral_redis
      REDIS_PORT: 6379
      FRONTEND_URL: https://umbral.proyectoscampus.top
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - ./backend:/var/www/html
      - umbral_backend_vendor:/var/www/html/vendor
      # Límite de subida de PHP (fotos de documentos de hasta 5 MB)
      - ./docker/backend/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      - umbral_network

  # Trabajador de segundo plano: revisa con la IA (DeepSeek) los documentos de identidad
  # de las cuentas nuevas. Usa el mismo código y la misma configuración que umbral_backend.
  umbral_queue:
    build:
      context: ./docker/backend
    container_name: umbral_queue
    restart: unless-stopped
    depends_on:
      umbral_backend:
        condition: service_started
      umbral_postgres:
        condition: service_healthy
      umbral_redis:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]
    environment:
      DB_HOST: umbral_postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: prefer
      REDIS_HOST: umbral_redis
      REDIS_PORT: 6379
      FRONTEND_URL: https://umbral.proyectoscampus.top
    volumes:
      - ./backend:/var/www/html
      - umbral_backend_vendor:/var/www/html/vendor
    networks:
      - umbral_network

  umbral_frontend:
    image: nginx:alpine
    container_name: umbral_frontend
    restart: unless-stopped
    depends_on:
      - umbral_backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Vigilante de seguridad: nginx escribe aquí el registro de visitas y lee la lista de IP bloqueadas
      - ./vigilante/logs:/var/log/umbral
      - ./vigilante/bloqueados:/etc/nginx/vigilante
      - ./docker/nginx/recargar-bloqueados.sh:/recargar-bloqueados.sh:ro
    # Crea la lista vacía si no existe, vigila cambios en ella (recarga nginx) y arranca nginx
    command: ["/bin/sh", "-c", "touch /etc/nginx/vigilante/bloqueados.conf; /bin/sh /recargar-bloqueados.sh & exec nginx -g 'daemon off;'"]
    networks:
      - umbral_network
      - proxy

  # Vigilante de seguridad en Python (carpeta seguridad-python/): lee el registro de visitas de nginx
  # y bloquea 30 minutos las IP que atacan (muchos fallos de login, escaneo de rutas, rutas de ataque).
  # Para apagarlo sin tocar nada más: docker stop umbral_vigilante
  umbral_vigilante:
    build:
      context: ./seguridad-python
    container_name: umbral_vigilante
    restart: unless-stopped
    depends_on:
      - umbral_frontend
    environment:
      # IP que nunca se bloquean (separadas por coma). Las redes privadas ya están incluidas.
      IPS_PERMITIDAS: ${VIGILANTE_IPS_PERMITIDAS:-181.128.79.248}
      VIG_MAX_AUTH_FALLOS: ${VIGILANTE_MAX_AUTH_FALLOS:-10}
      VIG_MAX_404: ${VIGILANTE_MAX_404:-20}
      VIG_BLOQUEO_MIN: ${VIGILANTE_BLOQUEO_MIN:-30}
    volumes:
      - ./vigilante/logs:/logs
      - ./vigilante/bloqueados:/bloqueados
    networks:
      - umbral_network

networks:
  umbral_network:
    driver: bridge
  proxy:
    external: true

volumes:
  umbral_postgres_data:
  umbral_redis_data:
  umbral_backend_vendor:
