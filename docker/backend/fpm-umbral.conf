; Trabajadores de PHP-FPM para Umbral.
; El servidor es compartido con otros proyectos (12 GB de memoria): pocos trabajadores, con reciclaje.
[www]
user = root
group = root
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
request_terminate_timeout = 60s
catch_workers_output = yes
; IMPORTANTE: no borrar las variables de entorno de Docker (DB_HOST, REDIS_HOST...), Laravel las necesita
clear_env = no
