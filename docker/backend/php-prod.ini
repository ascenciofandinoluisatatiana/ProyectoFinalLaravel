; Ajustes de PHP para producción en Umbral
; Subidas: GIF de propiedades de hasta 8 MB y fotos de documentos de 5 MB
upload_max_filesize = 10M
post_max_size = 12M
; Una petición no puede tardar más de 60 s (igual que el límite de nginx)
max_execution_time = 60
memory_limit = 128M

; opcache: guarda el código ya compilado. Sigue revisando cambios cada 2 s para que "git pull" se note sin reiniciar.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
