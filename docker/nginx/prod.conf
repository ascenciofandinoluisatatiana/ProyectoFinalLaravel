server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirecciones relativas: que el navegador conserve su puerto (3000)
    absolute_redirect off;

    # Nombre de servicios de Docker (para encontrar a "app")
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://umbral_backend:8000;

    # /admin → redirige al nuevo login del frontend
    # El panel completo ya vive en /panel-admin/ como HTML estático
    location = /admin {
        return 301 /panel-admin/login.html;
    }
    location = /admin/ {
        return 301 /panel-admin/login.html;
    }

    # /admin/... (rutas viejas del Blade, por si algún marcador antiguo las usa)
    location ^~ /admin/ {
        return 301 /panel-admin/login.html;
    }

    # /assets → nginx lo sirve directo desde el frontend (sin pasar por Laravel)
    # Los archivos deben estar en frontend/assets/admin/
    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # /api y /storage → Laravel (backend)
    location ~ ^/(api|up|storage)(/|$) {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Todo lo demás: frontend estático
    location / {
        try_files $uri $uri/ =404;
    }
}
