# Producción: nginx le habla a PHP-FPM (puerto 9000 de umbral_backend) en vez de "php artisan serve" (S10).
# Quién pide la página: WhatsApp, Facebook, X, Telegram, LinkedIn, Google, etc. (rastreadores de enlaces) reciben la ficha
# con foto y precio del inmueble (Laravel); las personas reciben el portal normal.
# Protocolo real (http/https): si hay un proxy delante que ya lo manda, se respeta
map $http_x_forwarded_proto $proto_real {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_user_agent $es_rastreador {
    default 0;
    "~*(facebookexternalhit|facebot|whatsapp|twitterbot|telegrambot|linkedinbot|slackbot|discordbot|pinterest|skypeuripreview|googlebot|bingbot|applebot|embedly|vkshare)" 1;
}

# Caché de fotos (/storage): la primera vez una foto se pide a Laravel (que puede traerla del bucket);
# después nginx la entrega solo desde su disco, sin pasar por Laravel. Guarda hasta 2 GB (unas 7.000 fotos con margen) y las borra si nadie las pide en 14 días.
fastcgi_cache_path /var/cache/nginx/fotos levels=1:2 keys_zone=fotos:50m max_size=2g inactive=14d use_temp_path=off;

# --- Vigilante de seguridad (carpeta seguridad-python/) ---
# IP real de la persona: Caddy la manda en X-Forwarded-For (Caddy reemplaza lo que mande el cliente)
map $http_x_forwarded_for $ip_real_cliente {
    default $remote_addr;
    "~^\s*(?<primera_ip>[0-9a-fA-F:.]+)" $primera_ip;
}
# Una línea JSON por visita: la lee el vigilante
log_format umbral_json escape=json '{"t":"$time_iso8601","ip":"$ip_real_cliente","m":"$request_method","u":"$request_uri","s":$status}';
# Lista de IP bloqueadas (la escribe el vigilante; el archivo debe existir; el arranque lo crea vacío si falta)
geo $ip_real_cliente $ip_bloqueada {
    default 0;
    include /etc/nginx/vigilante/bloqueados.conf;
}

server {
    listen 80;
    server_name _;

    # No mostrar la versión de nginx
    server_tokens off;

    # Registro de visitas para el vigilante (y el registro normal que se ve con docker logs)
    access_log /var/log/umbral/access.log umbral_json;
    access_log /var/log/nginx/access.log main;

    # IP bloqueada por el vigilante: no entra
    if ($ip_bloqueada) {
        return 403;
    }

    # --- Cabeceras de seguridad (S6) ---
    # Nadie puede meter Umbral dentro de otra página
    add_header X-Frame-Options "SAMEORIGIN" always;
    # El navegador no adivina el tipo de los archivos
    add_header X-Content-Type-Options "nosniff" always;
    # Al salir a otro sitio no se manda la dirección completa de la página
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Lista de sitios permitidos: Umbral, Google Fonts, cdnjs (Font Awesome, mapa, gráficas) y el captcha de Cloudflare.
    # Imágenes por https: fotos del bucket y mapas de OpenStreetMap. Si algo se bloquea, la consola (F12) dice "Content Security Policy".
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; media-src 'self' blob: data: https:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Fotos de documentos del registro (5 MB) y GIF de propiedades (8 MB): hasta 12 MB con margen
    client_max_body_size 12m;

    # Redirecciones relativas: que el navegador conserve su puerto (3000)
    absolute_redirect off;

    # Nombre de servicios de Docker (para encontrar a "app")
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fpm umbral_backend:9000;

    # /admin → redirige al nuevo login del frontend
    # El panel completo ya vive en /panel-admin/ como HTML estático
    location = /admin {
        return 301 /panel-admin/login.html;
    }
    location = /admin/ {
        return 301 /panel-admin/login.html;
    }

    # /admin/... (rutas viejas del Blade, por si algún marcador antiguo las usa)
    location ^~ /admin/ {
        return 301 /panel-admin/login.html;
    }

    # /assets → nginx lo sirve directo desde el frontend (sin pasar por Laravel)
    # Los archivos deben estar en frontend/assets/admin/
    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # /storage → fotos de propiedades y avatares. Con caché en nginx: así las fotos no ocupan
    # los trabajadores de Laravel y la página responde rápido aunque haya muchas visitas.
    # (Va antes que la regla de /api porque "^~" tiene prioridad sobre las expresiones regulares.)
    location ^~ /storage/ {
        include fastcgi_params;
        fastcgi_pass $fpm;
        # Todo pasa por el index.php de Laravel (el archivo vive dentro del contenedor de PHP-FPM)
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # Dirección real de la persona y protocolo real (https), igual que antes con el proxy
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $proto_real;
        fastcgi_read_timeout 60s;

        fastcgi_cache fotos;
        fastcgi_cache_key "$uri";
        fastcgi_cache_valid 200 7d;
        fastcgi_cache_valid 404 1m;
        # Si 20 personas piden la misma foto a la vez, solo una va a Laravel; las demás esperan ese resultado
        fastcgi_cache_lock on;
        # Si Laravel falla o tarda, se sigue mostrando la foto guardada
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        # Laravel manda una cookie de sesión y cabeceras de caché en cada foto; aquí no sirven (la foto es pública)
        fastcgi_ignore_headers Set-Cookie Cache-Control Expires;
        fastcgi_hide_header Set-Cookie;
        fastcgi_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
        # Para comprobar: MISS = vino de Laravel, HIT = salió de la caché de nginx
        add_header X-Cache $upstream_cache_status;
    }

    # /api y /storage → Laravel (backend). También /sitemap.xml y /robots.txt, que Laravel genera con las propiedades publicadas
    location ~ ^/(api|up|storage|sitemap\.xml|robots\.txt)(/|$) {
        include fastcgi_params;
        fastcgi_pass $fpm;
        # Todo pasa por el index.php de Laravel (el archivo vive dentro del contenedor de PHP-FPM)
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # Dirección real de la persona y protocolo real (https), igual que antes con el proxy
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $proto_real;
        fastcgi_read_timeout 60s;
    }

    # /inmuebles → página pública del invitado (dirección corta)
    location = /inmuebles {
        try_files /invitado/dashboard.html =404;
        sub_filter '</head>' '<script src="/js/umbral-puertas.js?v=1"></script></head>';
        sub_filter_once on;
    }

    # /inmuebles/venta/nombre-12 y /inmuebles/arriendo/nombre-7 → la misma página; ella abre el inmueble según la URL
    # (los rastreadores de enlaces pasan antes por Laravel para ver foto, precio y ubicación del inmueble)
    location ^~ /inmuebles/ {
        error_page 418 = @ficha_inmueble;
        if ($es_rastreador) { return 418; }
        try_files /invitado/dashboard.html =404;
        sub_filter '</head>' '<script src="/js/umbral-puertas.js?v=1"></script></head>';
        sub_filter_once on;
    }

    # Ficha con etiquetas Open Graph del inmueble (la arma Laravel con los datos reales)
    location @ficha_inmueble {
        include fastcgi_params;
        fastcgi_pass $fpm;
        # Todo pasa por el index.php de Laravel (el archivo vive dentro del contenedor de PHP-FPM)
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # Dirección real de la persona y protocolo real (https), igual que antes con el proxy
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $proto_real;
        fastcgi_read_timeout 30s;
    }

    # Archivos ocultos (.env, .git, etc.): nunca se entregan. Se deja pasar .well-known.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Compresión: HTML, CSS y JS viajan mucho más livianos (ayuda al tiempo de carga)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Todo lo demás: frontend estático
    # A cada página HTML se le añade ocultar-ruta.js: en la barra de direcciones solo se ve el dominio
    # (Invitado, /inmuebles, no se oculta; el propio script lo respeta). Subir ?v= si el script cambia.
    location / {
        try_files $uri $uri/ =404;
        # Que el navegador pregunte si hay versión nueva antes de usar la guardada
        # (si no cambió, nginx responde 304 y no reenvía el archivo). No toca las cabeceras de seguridad.
        expires -1;
        sub_filter '</head>' '<script src="/js/umbral-puertas.js?v=1"></script><script src="/assets/ocultar-ruta.js?v=1"></script></head>';
        sub_filter_once on;
    }
}