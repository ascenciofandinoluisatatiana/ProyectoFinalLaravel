<!DOCTYPE html>
<html lang="es" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio · Agente · Umbral</title>
    <link rel="icon" type="image/png" href="/img/icono.png">

    <!-- Fuentes del diseño (las mismas del inicio y el login) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Mismo diseño del panel del vendedor + iconos (los entrega Laravel en /assets) -->
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/solid.min.css">
    <link rel="stylesheet" href="/vendedor/css/vendedor.css">
    <link rel="stylesheet" href="/inmobiliaria/css/inmobiliaria.css">
    <link rel="stylesheet" href="/inmobiliaria/css/banner-inmobiliaria.css?v=2">
    <link rel="stylesheet" href="/css/banner-escenas.css?v=2">

    <!-- Recuerda el tema elegido ANTES de pintar la página (evita el parpadeo) -->
    <script src="/assets/inline/tema-claro-oscuro.js"></script>
</head>
<body class="vendedor op-arriendo" data-pagina="agente-inicio">
    <div class="v-pagina">
        <header class="v-topbar" id="v-topbar"></header>

        <main class="v-contenido">
            <div class="i-estado-carga" id="d-cargando"><i class="fa-solid fa-spinner fa-spin"></i>Cargando tu panel…</div>

            <!-- El banner lo dibuja js/banner-rol.js con los datos de agente/js/inicio.js -->
            <div id="d-panel" class="i-panel" hidden>
                <section class="ib-banner" id="ib-banner" aria-live="polite"></section>
                <section class="ib-grid" id="ib-grid"></section>
            </div>
        </main>
    </div>

    <script src="/agente/js/agente.js"></script>
    <script src="/js/banner-rol.js?v=2"></script>
    <script src="/agente/js/inicio.js?v=1"></script>
</body>
</html>
