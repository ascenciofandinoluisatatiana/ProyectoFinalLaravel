<!DOCTYPE html>
<html lang="es" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis propiedades · Agente · Umbral</title>
    <link rel="icon" type="image/png" href="/img/icono.png">

    <!-- Fuentes del diseño (las mismas del inicio y el login) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Mismo diseño del panel del vendedor + iconos (los entrega Laravel en /assets) -->
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/solid.min.css">
    <link rel="stylesheet" href="/vendedor/css/vendedor.css">
    <link rel="stylesheet" href="/inmobiliaria/css/inmobiliaria.css">

    <!-- Recuerda el tema elegido ANTES de pintar la página (evita el parpadeo) -->
    <script src="/assets/inline/tema-claro-oscuro.js"></script>
</head>
<body class="vendedor op-arriendo" data-pagina="agente-propiedades">
    <div class="v-pagina">
        <header class="v-topbar" id="v-topbar"></header>

        <main class="v-contenido">
            <div class="i-estado-carga" id="d-cargando"><i class="fa-solid fa-spinner fa-spin"></i>Cargando propiedades…</div>

            <div id="d-panel" class="i-panel" hidden>
                <section class="v-tarjeta v-hero">
                    <div>
                        <p class="v-etiqueta"><i class="fa-solid fa-house"></i> Mis propiedades</p>
                        <h1 class="titulo-serif">Propiedades a tu cargo</h1>
                        <p>Las asigna tu inmobiliaria. Si algún dato está mal, pídele que lo corrija.</p>
                    </div>
                </section>
                <section class="v-tarjeta">
                    <div class="v-tarjeta-cabeza"><h2>Inmuebles</h2><small id="d-total"></small></div>
                    <form class="i-filtros-compactos" id="d-filtros" novalidate role="search" aria-label="Filtros">
                        <label class="i-fc-buscar"><i class="fa-solid fa-magnifying-glass"></i><span class="v-oculto">Buscar</span><input name="q" type="search" placeholder="Barrio, ciudad o dirección" maxlength="100"></label>
                        <label class="i-fc"><span>Operación</span><select name="operacion"><option value="">Todas</option><option value="venta">Venta</option><option value="arriendo">Arriendo</option></select></label>
                        <label class="i-fc"><span>Estado</span><select name="estado"><option value="">Todos</option><option value="publicada">Publicada</option><option value="pausada">Pausada</option><option value="vendida">Vendida</option><option value="arrendada">Arrendada</option><option value="borrador">Borrador</option></select></label>
                        <button type="button" class="i-icono-mini" data-limpiar title="Limpiar filtros" aria-label="Limpiar filtros"><i class="fa-solid fa-eraser"></i></button>
                    </form>
                    <div class="i-secciones" id="d-propiedades"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="/js/selector-idioma.js?v=1"></script>
    <script src="/agente/js/agente.js?v=2"></script>
    <script src="/agente/js/propiedades.js"></script>
    <script src="/js/marca-umbral.js?v=1"></script>
</body>
</html>
