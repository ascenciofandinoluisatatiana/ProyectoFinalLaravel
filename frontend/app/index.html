<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UMBRAL</title>
  <meta name="theme-color" content="#140826">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/img/icono.png">
  <link rel="apple-touch-icon" href="/img/pwa-192.png">
  <link rel="stylesheet" href="/app/app.css?v=3">
  <script src="/assets/inline/tema-inicio.js"></script>
</head>
<body>
  <!-- 1 · Inicio -->
  <section class="pantalla" id="p-inicio" aria-labelledby="t-inicio">
    <div class="capa">
      <div class="encabezado">
        <div>
          <div class="marca"><img src="/img/icono.png" alt="" width="34" height="34"><span class="logo">UMBRAL</span></div>
          <p class="eslogan" id="x-slogan"></p>
        </div>
        <button type="button" class="boton-modo" data-modo aria-label="Tema"><svg class="i-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
      <div class="contenido">
        <h1 id="t-inicio"><span id="x-headline"></span> <em id="x-headline2"></em></h1>
        <div class="descripcion-panel"><p id="x-intro"></p></div>
      </div>
      <div class="pie">
        <button type="button" class="boton-continuar" id="b-explorar"></button>
      </div>
    </div>
  </section>

  <!-- 2 · Idioma -->
  <section class="pantalla pantalla-lisa" id="p-idioma" aria-labelledby="t-idioma" hidden>
    <div class="columna">
      <div class="encabezado-idioma">
        <button type="button" class="boton-volver" data-volver aria-label="Volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button type="button" class="boton-modo" data-modo aria-label="Tema"><svg class="i-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
      <div class="contenido-idioma">
        <div class="logo-marco"><img src="/img/icono.png" alt="" width="72" height="72"></div>
        <p class="etiqueta" id="x-etiqueta">UMBRAL · TU PRÓXIMO HOGAR</p>
        <h2 id="t-idioma"></h2>
        <p class="descripcion-idioma" id="x-idioma-sub"></p>
        <div class="lista-idiomas" id="lista-idiomas" role="radiogroup"></div>
        <button type="button" class="boton-confirmar" id="b-continuar"></button>
      </div>
    </div>
  </section>

  <!-- 3 · Cómo continuar -->
  <section class="pantalla pantalla-lisa" id="p-acceso" aria-labelledby="t-acceso" hidden>
    <div class="columna">
      <div class="encabezado-idioma">
        <button type="button" class="boton-volver" data-volver aria-label="Volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button type="button" class="boton-modo" data-modo aria-label="Tema"><svg class="i-luna" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
      <div class="contenido-acceso">
        <img class="acceso-logo" src="/img/icono.png" alt="" width="92" height="92">
        <h2 class="acceso-titulo" id="t-acceso"></h2>
        <p class="acceso-descripcion" id="x-acceso-sub"></p>

        <a class="tarjeta-acceso" id="a-invitado" href="/invitado/dashboard.html">
          <div class="fila-icono">
            <span class="icono-fondo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>
            <span class="textos-tarjeta"><strong id="x-invitado"></strong><small id="x-invitado-d"></small></span>
          </div>
          <div class="accion-fila"><span class="accion" id="x-invitado-a"></span><span class="flecha-acc">›</span></div>
        </a>

        <a class="tarjeta-acceso" id="a-personal" href="/index.html?auth=login">
          <div class="fila-icono">
            <span class="icono-fondo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></span>
            <span class="textos-tarjeta"><strong id="x-personal"></strong><small id="x-personal-d"></small></span>
          </div>
          <div class="accion-fila"><span class="accion" id="x-personal-a"></span><span class="flecha-acc">›</span></div>
        </a>

        <p class="acceso-nota" id="x-nota"></p>
      </div>
    </div>
  </section>

  <script src="/app/app.js?v=4"></script>
</body>
</html>
