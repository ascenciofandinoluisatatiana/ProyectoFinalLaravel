<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <script src="/invitado/js/arranque.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorar propiedades · UMBRAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="/invitado/css/invitado.css">
<link rel="stylesheet" href="/invitado/css/premium.css">
</head>

<body>
  <div class="app">
    <div class="shade" id="shade"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img class="marca-img" src="/img/icono.png" alt="Umbral">
        <div class="marca-txt"><strong>UMBRAL</strong><em data-i18n="tagline"></em></div>
      </div>
      <div class="nav-label" data-i18n="nav_main"></div>
      <nav class="nav">
        <a class="active" data-nav="all"><i class="fa-solid fa-compass"></i><span data-i18n="nav_explore"></span></a>
        <a data-nav="map"><i class="fa-solid fa-map-location-dot"></i><span data-i18n="nav_map"></span></a>
        <a data-nav="favs"><i class="fa-solid fa-heart"></i><span data-i18n="nav_favs"></span></a>
      </nav>
      <div class="nav-label" data-i18n="nav_tools"></div>
      <nav class="nav">
        <a data-nav="calc"><i class="fa-solid fa-calculator"></i><span data-i18n="nav_calc"></span></a>
        <a data-nav="sellers"><i class="fa-solid fa-address-card"></i><span data-i18n="nav_sellers"></span></a>
      </nav>
      <div class="guest-card">
        <h4><i class="fa-solid fa-user-clock"></i> <span data-i18n="guest_mode"></span></h4>
        <p data-i18n="guest_note"></p>
        <a class="btn btn-primary btn-sm" style="width:100%" href="/index.html?auth=register"><i
            class="fa-solid fa-store"></i><span data-i18n="register_sell"></span></a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
        <h1 data-i18n="page_title"></h1>
        <div class="search"><i class="fa-solid fa-magnifying-glass" style="color:var(--muted)"></i><input id="q"
            data-i18n-ph="search_ph"></div>
        <select class="lang" id="lang" aria-label="Idioma">
          <option value="es">Español</option>
          <option value="en">English</option>
          <option value="pt">Português</option>
          <option value="fr">Français</option>
        </select>
        <button class="icon-btn" id="themeBtn" title="Tema"><i class="fa-solid fa-moon"></i></button>
        <div class="user-chip">
          <div class="avatar">IN</div>
          <div><b data-i18n="guest"></b><small data-i18n="guest_role"></small></div>
        </div>
        <a class="btn btn-ghost btn-sm" href="/index.html?auth=login" style="white-space:nowrap"><i
            class="fa-solid fa-right-to-bracket"></i><span data-i18n="login"></span></a>
        <a class="btn btn-ghost btn-sm" id="exitBtn" href="/index.html" style="white-space:nowrap;color:var(--red)"><i
            class="fa-solid fa-arrow-right-from-bracket"></i><span data-i18n="exit"></span></a>
      </header>

      <main class="content">
        <section class="hero" id="hero">
          <div class="hero-in">
            <div class="tag"><i class="fa-solid fa-wand-magic-sparkles"></i> <span data-i18n="banner_tag"></span></div>
            <h2><span id="greet"></span></h2>
            <p id="bannerText"></p>
            <div class="hsearch">
              <div class="ops" id="ops">
                <button class="op active" data-op="all" data-i18n="op_all"></button>
                <button class="op" data-op="venta"><i class="fa-solid fa-tag"></i> <span
                    data-i18n="buy"></span></button>
                <button class="op" data-op="arriendo"><i class="fa-solid fa-key"></i> <span
                    data-i18n="rent"></span></button>
              </div>
              <div class="hbar">
                <i class="fa-solid fa-magnifying-glass hico"></i>
                <input id="qHero" data-i18n-ph="search_ph" autocomplete="off">
                <button type="button" class="hmore" id="moreBtn" aria-expanded="false"><i
                    class="fa-solid fa-sliders"></i><span data-i18n="f_btn"></span><i
                    class="fa-solid fa-chevron-down chev"></i></button>
                <button class="btn btn-primary" id="goExplore"><i class="fa-solid fa-magnifying-glass"></i><span
                    data-i18n="btn_explore"></span></button>
              </div>
            </div>
            <div class="pills">
              <span class="pill"><i class="fa-regular fa-clock"></i><span id="clock"></span></span>
              <span class="pill"><i class="fa-solid fa-location-dot"></i>Colombia</span>
              <span class="pill"><i class="fa-solid fa-language"></i><span id="langPill"></span></span>
            </div>
          </div>
        </section>

        <section class="stats">
          <div class="stat" style="--c:#6c3df5">
            <div class="ico"><i class="fa-solid fa-house"></i></div><b id="s1">0</b><span data-i18n="stat_props"></span>
          </div>
          <div class="stat" style="--c:#10b981">
            <div class="ico"><i class="fa-solid fa-city"></i></div><b id="s2">0</b><span data-i18n="stat_cities"></span>
          </div>
          <div class="stat" style="--c:#f59e0b">
            <div class="ico"><i class="fa-solid fa-people-roof"></i></div><b id="s3">0</b><span
              data-i18n="stat_sellers"></span>
          </div>
          <div class="stat" style="--c:#3b82f6">
            <div class="ico"><i class="fa-solid fa-circle-check"></i></div><b id="s4">0</b><span
              data-i18n="stat_verified"></span>
          </div>
        </section>

        <section class="panel" id="filters">
          <div class="grid-f">
            <div class="field"><label data-i18n="f_type"></label><select id="fType"></select></div>
            <div class="field"><label data-i18n="f_dept"></label><select id="fDept"></select></div>
            <div class="field"><label data-i18n="f_city"></label><select id="fCity"></select></div>
            <div class="field"><label data-i18n="f_barrio"></label><select id="fBarrio"></select></div>
            <div class="field"><label data-i18n="f_max"></label><input id="fMax" type="number" min="0"
                placeholder="COP"></div>
            <div class="field"><label data-i18n="f_beds"></label><select id="fBeds"></select></div>
            <div class="field"><label data-i18n="f_sort"></label><select id="fSort"></select></div>
          </div>
        </section>

        <div class="res-head">
          <h3><span data-i18n="results"></span><small id="count"></small></h3>
          <div class="toolbar">
            <span class="chip" id="sellerChip" style="display:none"></span>
            <button class="btn btn-ghost btn-sm" id="clearBtn"><i class="fa-solid fa-rotate-left"></i><span
                data-i18n="clear"></span></button>
            <div class="seg"><button class="active" data-view="cards"><i class="fa-solid fa-table-cells-large"></i>
                <span data-i18n="v_cards"></span></button><button data-view="map"><i class="fa-solid fa-map"></i> <span
                  data-i18n="v_map"></span></button></div>
          </div>
        </div>
        <div class="cards" id="cards"></div>
        <div id="mapView"></div>
      </main>
    </div>
  </div>

  <!-- detalle -->
  <div class="mbg" id="mDetail">
    <div class="modal"><button class="mclose" data-close><i class="fa-solid fa-xmark"></i></button>
      <div id="detailBody"></div>
    </div>
  </div>
  <!-- PSE -->
  <div class="mbg" id="mPse">
    <div class="modal sm"><button class="mclose" data-close><i class="fa-solid fa-xmark"></i></button>
      <div class="mbody" id="pseBody"></div>
    </div>
  </div>
  <!-- calculadora -->
  <div class="mbg" id="mCalc">
    <div class="modal sm"><button class="mclose" data-close><i class="fa-solid fa-xmark"></i></button>
      <div class="mbody">
        <h3 data-i18n="calc_title"></h3>
        <p style="color:var(--muted);font-size:13px;margin-bottom:14px" data-i18n="calc_note"></p>
        <div class="stack">
          <div class="field"><label data-i18n="calc_price"></label><input id="cPrice" type="number" value="500000000">
          </div>
          <div class="field"><label data-i18n="calc_down"></label><input id="cDown" type="number" value="30"></div>
          <div class="field"><label data-i18n="calc_rate"></label><input id="cRate" type="number" value="12" step="0.1">
          </div>
          <div class="field"><label data-i18n="calc_years"></label><input id="cYears" type="number" value="15"></div>
        </div>
        <div class="calc-out"><span style="color:var(--muted)" data-i18n="calc_result"></span><b id="cOut">—</b></div>
      </div>
    </div>
  </div>
  <!-- vendedores -->
  <div class="mbg" id="mSellers">
    <div class="modal"><button class="mclose" data-close><i class="fa-solid fa-xmark"></i></button>
      <div class="mbody">
        <h3 id="sellersAnchor" data-i18n="sellers_title"></h3>
        <div class="sellers" id="sellers"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/invitado/js/configuracion.js"></script>
  <script src="/invitado/js/textos.js"></script>
  <script src="/invitado/js/datos-demo.js"></script>
  <script src="/invitado/js/api.js"></script>
  <script src="/invitado/js/estado.js"></script>
  <script src="/invitado/js/idioma.js"></script>
  <script src="/invitado/js/filtros.js"></script>
  <script src="/invitado/js/tarjetas.js"></script>
  <script src="/invitado/js/mapa.js"></script>
  <script src="/invitado/js/detalle.js"></script>
  <script src="/invitado/js/pago-pse.js"></script>
  <script src="/invitado/js/modales.js"></script>
  <script src="/invitado/js/eventos.js"></script>
  <script src="/js/efectos.js"></script>
  <script src="/js/hero.js"></script>
  <script src="/js/vendedores.js"></script>
</body>

</html>
