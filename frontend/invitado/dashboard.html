<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<script>document.documentElement.classList.add('js-hero');setTimeout(function(){if(!document.getElementById('fBackdrop'))document.documentElement.classList.remove('js-hero')},4000)</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorar propiedades · UMBRAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#f4f1fd;--card:#fff;--text:#1b1535;--muted:#6b6785;--border:#e7e2f7;
  --primary:#6c3df5;--primary2:#8b5cf6;--soft:#efe9ff;--green:#10b981;--orange:#f59e0b;--blue:#3b82f6;--red:#ef4444;
  --shadow:0 6px 24px rgba(88,60,180,.08);--banner:linear-gradient(120deg,#e6dcfb 0%,#d9d4fb 45%,#cfe6fb 100%);
}
[data-theme="dark"]{
  --bg:#0e0a1d;--card:#18132c;--text:#f1eeff;--muted:#a49fc4;--border:#2b2447;
  --soft:#261e47;--shadow:0 6px 24px rgba(0,0,0,.35);--banner:linear-gradient(120deg,#2a1f55 0%,#241d4d 50%,#183056 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
/* layout */
.app{display:flex;min-height:100vh}
.sidebar{width:290px;background:var(--card);border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50;transition:transform .3s}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 22px;border-bottom:1px solid var(--border);margin-bottom:18px}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 6px 16px rgba(108,61,245,.4)}
.brand b{letter-spacing:.28em;font-size:20px;display:block}
.brand small{color:var(--muted);font-size:12px}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);padding:14px 12px 8px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;color:var(--muted);font-weight:600;margin-bottom:4px;cursor:pointer}
.nav a i{width:20px;text-align:center}
.nav a:hover{background:var(--soft)}
.nav a.active{background:var(--soft);color:var(--primary);border:1px solid var(--border)}
.guest-card{margin-top:auto;padding:16px;border-radius:16px;background:var(--soft);border:1px solid var(--border)}
.guest-card h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.guest-card p{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.45}
.main{flex:1;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 28px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.topbar h1{font-size:19px;font-weight:700;white-space:nowrap}
.menu-btn{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--border)}
.search{flex:1;max-width:520px;margin-left:auto;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:12px;padding:0 14px;height:44px;background:var(--bg)}
.search input{border:none;outline:none;background:none;flex:1}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--bg);display:grid;place-items:center;color:var(--primary)}
.lang{height:44px;border-radius:12px;border:1px solid var(--border);background:var(--bg);padding:0 10px;font-weight:600;cursor:pointer}
.user-chip{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:14px;padding:6px 12px;background:var(--bg)}
.avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.user-chip b{font-size:14px;display:block;line-height:1.2}.user-chip small{color:var(--primary);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;transition:.2s}
.btn-primary{background:linear-gradient(135deg,#5b2ff0,#7c4dff);color:#fff;box-shadow:0 6px 16px rgba(108,61,245,.35)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{border:1px solid var(--border);background:var(--card)}
.btn-ghost:hover{background:var(--soft)}
.btn-green{background:linear-gradient(135deg,#059669,#10b981);color:#fff;box-shadow:0 6px 16px rgba(16,185,129,.3)}
.btn-orange{background:linear-gradient(135deg,#ea8a04,#f59e0b);color:#fff;box-shadow:0 6px 16px rgba(245,158,11,.3)}
.btn-sm{padding:9px 14px;font-size:13px}
.content{padding:26px 28px 60px;max-width:1500px}
/* banner */
.banner{background:var(--banner);border:1px solid var(--border);border-radius:24px;padding:30px 34px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.tag{color:var(--primary);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.banner h2{font-size:34px;font-weight:800;margin:6px 0}
.banner h2 span{color:var(--primary)}
.banner p{color:var(--muted);margin-bottom:14px}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--soft);border:1px solid var(--border);color:var(--primary);font-weight:600;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:24px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow);border-top:3px solid var(--c)}
.stat .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);margin-bottom:16px}
.stat b{font-size:30px;font-weight:800;display:block}.stat span{color:var(--muted)}
/* filters */
.panel{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.ops{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.op{padding:10px 20px;border-radius:12px;border:1px solid var(--border);font-weight:700;color:var(--muted)}
.op.active{background:linear-gradient(135deg,#5b2ff0,#7c4dff);color:#fff;border-color:transparent}
.grid-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field select,.field input,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);outline:none}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--primary)}
.res-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 16px;gap:12px;flex-wrap:wrap}
.res-head h3{font-size:22px}.res-head small{color:var(--muted);font-weight:500;font-size:14px;margin-left:8px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{padding:10px 16px;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--soft);color:var(--primary)}
.chip{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--soft);color:var(--primary);font-weight:600;font-size:13px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.25s}
.pcard:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(88,60,180,.18)}
.pimg{height:140px;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.9);font-size:46px;cursor:pointer;background-size:cover;background-position:center}
.pimg .badges{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.b{padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;display:inline-flex;gap:5px;align-items:center;font-family:inherit}
.b-sale{background:#5b2ff0}.b-rent{background:#0ea5e9}.b-ver{background:#10b981}.b-prem{background:#f59e0b}
.fav{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);color:#9a94b8;display:grid;place-items:center;font-size:16px}
.fav.on{color:var(--red)}
.pbody{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.price{font-size:19px;font-weight:800;color:var(--primary)}.price small{font-size:13px;color:var(--muted);font-weight:600}
.ptitle{font-weight:700;font-size:15px}
.loc{color:var(--muted);font-size:13px;display:flex;gap:7px;align-items:center}
.specs{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:10px 0;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border)}
.specs i{color:var(--primary);margin-right:5px}
.mini-seller{display:flex;align-items:center;gap:10px;font-size:13px}
.mini-seller .avatar{width:34px;height:34px;font-size:12px}
.mini-seller b{display:block}.mini-seller small{color:var(--muted)}
.pactions{display:flex;gap:8px;margin-top:auto}
.pactions .btn{flex:1}
#mapView{display:none;height:560px;border-radius:20px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow)}
[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
.empty i{font-size:40px;color:var(--primary);margin-bottom:12px}
/* sellers */
.sellers{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.scard{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.scard .top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.scard .avatar{width:54px;height:54px;font-size:18px;border-radius:16px}
.scard h4{font-size:16px}.scard small{color:var(--muted)}
.scard ul{list-style:none;font-size:13px;color:var(--muted);display:grid;gap:8px;margin-bottom:14px}
.scard ul i{color:var(--primary);width:18px}
.ver-tag{color:var(--green);font-size:12px;font-weight:700}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(10,6,28,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:100}
.mbg.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:24px;width:100%;max-width:980px;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal.sm{max-width:480px}
.mclose{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);color:#333;z-index:5;font-size:16px}
.mhero{height:240px;display:grid;place-items:center;color:rgba(255,255,255,.9);font-size:90px;position:relative}
.mhero .badges{position:absolute;left:18px;bottom:16px;display:flex;gap:6px}
.mcols{display:grid;grid-template-columns:1.4fr 1fr;gap:26px;padding:26px}
.mcols h2{font-size:24px;margin-bottom:6px}
.mcols h5{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.mcols p{color:var(--muted);line-height:1.6}
.mapbox{height:250px;border-radius:16px;overflow:hidden;border:1px solid var(--border);margin-top:8px}
.note{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--orange);font-weight:600;margin-top:8px}
.sbox{border:1px solid var(--border);border-radius:18px;padding:18px;background:var(--bg)}
.sbox .top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.stack{display:grid;gap:10px}
.mbody{padding:28px}
.mbody h3{margin-bottom:6px}
.sum{background:var(--soft);border-radius:14px;padding:14px;margin:14px 0;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.pse-logo{display:inline-flex;align-items:center;gap:8px;font-weight:800;color:#0b57d0;background:#e8f0fe;padding:6px 12px;border-radius:8px;font-size:13px}
.calc-out{text-align:center;padding:16px;border-radius:14px;background:var(--soft);margin-top:14px}
.calc-out b{font-size:28px;color:var(--primary);display:block}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(30px);background:#1b1535;color:#fff;padding:13px 22px;border-radius:12px;opacity:0;transition:.3s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.shade{display:none}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.mcols{grid-template-columns:1fr}}
@media(max-width:960px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .shade.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45}
  .menu-btn{display:grid;place-items:center}
  .user-chip div,.topbar h1{display:none}
  .content{padding:18px 16px 50px}.topbar{padding:12px 16px}
}
@media(max-width:600px){.stats{grid-template-columns:1fr}.banner h2{font-size:26px}.search{display:none}.cards{grid-template-columns:1fr}}

/* ===== HERO ===== */
.hero{position:relative;border-radius:28px;overflow:hidden;color:#fff;padding:44px 44px 34px;
  background:
    linear-gradient(110deg,rgba(40,16,100,.88) 0%,rgba(76,40,190,.66) 55%,rgba(20,60,140,.5) 100%),
    url(/img/hero.jpg) center/cover no-repeat,
    linear-gradient(120deg,#4c1d95 0%,#6c3df5 55%,#2563eb 100%);
  box-shadow:0 18px 50px rgba(60,30,160,.28)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;pointer-events:none}
.hero::before{width:340px;height:340px;background:#a78bfa;top:-120px;right:-60px}
.hero::after{width:300px;height:300px;background:#38bdf8;bottom:-140px;left:30%}
.hero-in{position:relative;z-index:1;max-width:900px}
.hero .tag{color:#ddd2ff}
.hero h2{font-size:44px;font-weight:800;line-height:1.1;margin:8px 0 6px;letter-spacing:-.01em}
.hero h2 .hl{color:#c4b5fd}
.hero p{color:rgba(255,255,255,.82);font-size:16px;margin-bottom:22px}
.hero .ops{margin-bottom:12px;gap:8px}
.hero .op{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;padding:9px 18px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero .op:hover{background:rgba(255,255,255,.24)}
.hero .op.active{background:#fff;color:var(--primary);border-color:#fff}
.hbar{display:flex;align-items:center;gap:10px;background:var(--card);color:var(--text);border-radius:20px;padding:8px 8px 8px 20px;box-shadow:0 22px 50px rgba(20,10,60,.4)}
.hbar .hico{color:var(--muted);font-size:17px}
.hbar input{flex:1;min-width:0;height:50px;border:none;outline:none;background:none;font-size:16px;color:var(--text)}
.hmore{display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--border);font-weight:700;color:var(--text);white-space:nowrap;transition:.2s}
.hmore:hover,.hmore.on{background:var(--soft);color:var(--primary)}
.hmore .chev{font-size:11px;transition:transform .25s}.hmore.on .chev{transform:rotate(180deg)}
.hbar .btn{height:50px;padding:0 24px;border-radius:14px;white-space:nowrap}
.hero .pills{margin-top:20px}
.hero .pill{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
.panel#filters{max-height:700px;transition:max-height .35s ease,padding .35s ease,opacity .25s ease,border-width .35s}
.panel#filters.collapsed{max-height:0;padding-top:0;padding-bottom:0;border-width:0;opacity:0;overflow:hidden;box-shadow:none}
.topbar .search{transition:opacity .25s}
body.hero-on:not(.hero-out) .topbar .search{opacity:0;pointer-events:none}
@media(max-width:700px){
  .hero{padding:28px 20px 24px;border-radius:22px}
  .hero h2{font-size:30px}
  .hbar{flex-wrap:wrap;padding:10px}
  .hbar .hico{display:none}
  .hbar input{flex:1 1 100%;padding:0 6px}
  .hbar .hmore,.hbar .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){.panel#filters,.hmore .chev{transition:none}}

/* ventana de vendedores */
#mSellers .mbody{padding:28px}
#mSellers h3{font-size:24px;margin-bottom:20px;padding-right:50px}
#mSellers .sellers{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
/* ===== RESPONSIVE ===== */
html{-webkit-text-size-adjust:100%}
img,video,svg{max-width:100%}
.topbar{min-width:0}
.topbar h1{overflow:hidden;text-overflow:ellipsis;min-width:0}
.search{min-width:120px}
.toast{max-width:calc(100vw - 32px)}
.mcols>*{min-width:0}
.modal{overflow-wrap:anywhere}
.specs{flex-wrap:wrap}

/* portátil / tablet horizontal */
@media(max-width:1280px){
  .user-chip div{display:none}
  .user-chip{padding:6px}
}
@media(max-width:1100px){
  .topbar{padding:14px 20px;gap:10px}
  .topbar h1{display:none}
  .topbar .btn-sm{width:42px;height:42px;padding:0;justify-content:center;gap:0}
  .topbar .btn-sm span{display:none}
}
/* tablet vertical */
@media(max-width:960px){
  .content{padding:18px 18px 50px}
}
/* celular */
@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}
  .stat{padding:14px;border-radius:16px}
  .stat .ico{width:38px;height:38px;border-radius:11px;margin-bottom:10px}
  .stat b{font-size:24px}
  .stat span{font-size:13px;line-height:1.3;display:block}
  .res-head h3{font-size:19px}
  .toolbar{width:100%}
  #mapView{height:60vh;min-height:340px;border-radius:16px}
  .modal{border-radius:20px}
  .mcols{padding:18px;gap:18px}
  .mbody,#mSellers .mbody{padding:20px}
  .mcols h2{font-size:21px}
}
@media(max-width:480px){
  .topbar{padding:10px 12px;gap:6px}
  .topbar select{max-width:96px;padding-left:8px;padding-right:4px}
  .user-chip{display:none}
  .content{padding:14px 12px 44px}
}
html.js-hero .panel#filters:not(.fmodal){display:none}

/* ===== Marca: logo + frase, igual que la portada ===== */
.marca-img{height:44px;width:auto;flex:none}
[data-theme="dark"] .marca-img{filter:brightness(1.9) saturate(1.1)}
.marca-txt{min-width:0}
.marca-txt strong{display:block;font-size:1.05rem;letter-spacing:.35em;font-weight:700}
.marca-txt em{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:.95rem;line-height:1.15;color:var(--primary2)}
@media(max-width:600px){.marca-img{height:38px}.marca-txt em{font-size:.85rem}}

/* ===== PREMIUM v2: carrusel top 10 con medallas ===== */
.prem-wrap{grid-column:1/-1;position:relative;overflow:hidden;border-radius:28px;padding:28px 26px 22px;margin-bottom:6px;color:#fff;
  background:linear-gradient(135deg,#1f0f55 0%,#3b1a8f 48%,#5b2ff0 100%);border:1px solid rgba(252,211,77,.38);box-shadow:0 22px 56px rgba(60,30,160,.34)}
.prem-wrap .pcard{color:var(--text)}
.prem-orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.prem-orb.o1{width:300px;height:300px;background:#fbbf24;top:-150px;right:-80px;opacity:.28}
.prem-orb.o2{width:320px;height:320px;background:#8b5cf6;bottom:-170px;left:-90px;opacity:.5}
.prem-head{position:relative;z-index:1;display:flex;align-items:center;gap:16px;margin-bottom:10px;flex-wrap:wrap}
.prem-crown{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:25px;color:#3b2400;flex:none;background:linear-gradient(135deg,#fde68a,#f59e0b);box-shadow:0 10px 26px rgba(245,158,11,.5)}
.prem-head h3{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.01em;background:linear-gradient(90deg,#fff,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
.prem-head p{color:rgba(255,255,255,.78);font-size:14px;margin-top:4px;max-width:560px}
.prem-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.prem-top{display:inline-flex;gap:8px;align-items:center;padding:8px 16px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.06em;color:#3b2400;background:linear-gradient(135deg,#fde68a,#f59e0b)}
.prem-arrow{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fde68a;background:rgba(255,255,255,.1);border:1px solid rgba(253,230,138,.45);transition:.2s}
.prem-arrow:hover:not(:disabled){background:#fde68a;color:#3b2400;transform:scale(1.06)}
.prem-arrow:disabled{opacity:.3;cursor:default}
.prem-track{position:relative;z-index:1;display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:12px 4px 24px;margin:0 -4px;scrollbar-width:none;outline:none;-webkit-overflow-scrolling:touch}
.prem-track::-webkit-scrollbar{display:none}
.prem-track .pcard{flex:0 0 clamp(250px,27%,300px);scroll-snap-align:start}
.prem-bar{position:relative;z-index:1;height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.prem-bar span{position:absolute;top:0;bottom:0;left:0;width:30%;border-radius:4px;background:linear-gradient(90deg,#fde68a,#f59e0b);transition:left .15s,width .15s}
.rest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;grid-column:1/-1}
/* medalla de posición */
.rank{position:absolute;left:14px;bottom:-20px;z-index:4;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;border:3px solid var(--card);box-shadow:0 6px 16px rgba(30,10,80,.35);background:linear-gradient(135deg,#a78bfa,#6c3df5)}
.rank.t-oro,.tier-chip.t-oro{background:linear-gradient(135deg,#fde68a,#f59e0b);color:#3b2400}
.rank.t-plata,.tier-chip.t-plata{background:linear-gradient(135deg,#f8fafc,#94a3b8);color:#1e293b}
.rank.t-bronce,.tier-chip.t-bronce{background:linear-gradient(135deg,#fdba74,#b45309);color:#fff}
.tier-chip{position:absolute;left:64px;bottom:-12px;z-index:4;padding:4px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 4px 12px rgba(30,10,80,.28);border:2px solid var(--card)}
.rest-sub{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;margin:-2px 0 6px}
.pcard.has-rank .pbody{padding-top:28px}
.pcard.has-rank .b-prem{display:none}
/* tarjeta premium */
.pcard.is-prem{border:1.5px solid #f5c451;box-shadow:0 12px 32px rgba(245,158,11,.22)}
.pcard.is-prem:hover{transform:translateY(-6px);box-shadow:0 0 0 1px #f5c451,0 22px 46px rgba(245,158,11,.4)}
.pcard.is-prem .price{font-size:22px}
.pcard.is-prem .mini-seller .avatar{box-shadow:0 0 0 2px var(--card),0 0 0 4px #f5c451}
/* ver más */
.more-bar{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 10px 10px;text-align:center;color:var(--muted);font-weight:600}
.more-bar::before{content:"";order:-1;width:100%;max-width:520px;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.btn-more{display:inline-flex;align-items:center;gap:10px;padding:14px 30px;border-radius:999px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#5b2ff0,#7c4dff);box-shadow:0 10px 26px rgba(108,61,245,.38);transition:.25s}
.btn-more:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(108,61,245,.5)}
.btn-more i{animation:moreBounce 1.6s ease-in-out infinite}
@keyframes moreBounce{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
.rest-head{grid-column:1/-1;display:flex;align-items:center;gap:16px;margin:14px 0 4px;font-size:20px;font-weight:800}
.rest-head::before,.rest-head::after{content:"";flex:1;height:1px;background:var(--border)}
.rest-grid.anim .pcard{animation:premIn .5s ease both;animation-delay:calc(min(var(--i,0),12)*45ms)}
@keyframes premIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* esqueleto de carga */
.pcard.sk{pointer-events:none}
.sk-b,.sk-l{background:linear-gradient(90deg,var(--soft) 25%,var(--border) 50%,var(--soft) 75%);background-size:200% 100%;animation:skShine 1.3s linear infinite}
.sk-l{display:block;height:14px;border-radius:8px}.sk-l.w40{width:40%}.sk-l.w60{width:60%}.sk-l.w90{width:90%}
.sk-btn{display:block;height:36px;border-radius:12px;flex:1}
@keyframes skShine{to{background-position:-200% 0}}
@media(max-width:600px){
  .prem-wrap{padding:20px 14px 18px;border-radius:22px}
  .prem-head h3{font-size:22px}.prem-right{margin-left:0}
  .prem-crown{width:46px;height:46px;font-size:20px}
  .prem-arrow{display:none}
  .prem-track .pcard{flex-basis:72vw}
  .rest-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.btn-more i,.rest-grid.anim .pcard,.sk-b,.sk-l{animation:none}.prem-track{scroll-behavior:auto}}
</style>
</head>

/* ============ API (Laravel) ============ */
const API = '/api/v1/public';
// Si la API no responde, se mantienen los datos de ejemplo de arriba.
let UBIC = null; // [{nombre, municipios:[...]}] con todos los departamentos y municipios de Colombia
async function loadData(){
  try{
    const u = await fetch(`${API}/ubicaciones`, {headers:{'Accept':'application/json'}});
    if(u.ok){ const uj = await u.json(); if(uj.data && uj.data.length) UBIC = uj.data; }
  }catch(_){}
  const res = await fetch(`${API}/propiedades?per_page=100`, {headers:{'Accept':'application/json'}});
  if(!res.ok) throw new Error('API '+res.status);
  const json = await res.json();
  if(!json.data || !json.data.length) return;
  const map = new Map();
  P = json.data.map(p => {
    if(!map.has(p.seller.id)) map.set(p.seller.id, {...p.seller, idx: map.size});
    return {...p, seller: map.get(p.seller.id).idx};
  });
  SELLERS = [...map.values()];
}

/* ============ filtros ============ */
const uniq = a => [...new Set(a)].sort((x,y)=>x.localeCompare(y,'es'));
function fill(sel,opts,val,allLabel){
  sel.innerHTML = `<option value="">${allLabel}</option>`+opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('');
  sel.value = opts.some(o=>String(o[0])===String(val))?val:'';
}
function buildFilters(){
  fill($('#fType'),Object.keys(TYPE_ICON).map(k=>[k,t('t_'+k)]),S.type,t('any'));
  const depts = UBIC ? UBIC.map(d=>d.nombre) : uniq(P.map(p=>p.dept));
  fill($('#fDept'),depts.map(d=>[d,d]),S.dept,t('any'));
  const byD = P.filter(p=>!S.dept||p.dept===S.dept);
  const cities = UBIC
    ? uniq(UBIC.filter(d=>!S.dept||d.nombre===S.dept).flatMap(d=>d.municipios))
    : uniq(byD.map(p=>p.city));
  fill($('#fCity'),cities.map(d=>[d,d]),S.city,t('anyf'));
  if(!cities.includes(S.city)) S.city='';
  const byC = byD.filter(p=>!S.city||p.city===S.city);
  fill($('#fBarrio'),uniq(byC.map(p=>p.barrio)).map(d=>[d,d]),S.barrio,t('any'));
  if(!byC.some(p=>p.barrio===S.barrio)) S.barrio='';
  fill($('#fBeds'),[1,2,3,4].map(n=>[n,n+'+']),S.beds,t('any'));
  $('#fSort').innerHTML = [['rel','s_rel'],['low','s_low'],['high','s_high']].map(o=>`<option value="${o[0]}">${t(o[1])}</option>`).join('');
  $('#fSort').value=S.sort;
}
function filtered(){
  let r = P.filter(p=>
    (S.op==='all'||p.op===S.op)&&(!S.type||p.type===S.type)&&(!S.dept||p.dept===S.dept)&&
    (!S.city||p.city===S.city)&&(!S.barrio||p.barrio===S.barrio)&&(!S.max||p.price<=+S.max)&&
    (!S.beds||p.beds>=+S.beds)&&(!S.favOnly||favs.includes(p.id))&&(S.seller===null||p.seller===S.seller)&&
    (!S.q||(`${t('t_'+p.type)} ${p.type} ${p.city} ${p.barrio} ${p.dept}`).toLowerCase().includes(S.q.toLowerCase())));
  if(S.sort==='low') r.sort((a,b)=>a.price-b.price);
  else if(S.sort==='high') r.sort((a,b)=>b.price-a.price);
  else r.sort((a,b)=>(tierN(b)-tierN(a))||((b.score||0)-(a.score||0))||(b.ver-a.ver)); // RF-053: mejor posicionamiento con membresía
  return r;
}

/* ============ PREMIUM v2: top 10 en carrusel y "ver más" ============ */
const TIER_N={oro:3,plata:2,bronce:1};
function tierN(p){return TIER_N[p.tier]||(p.prem?1:0)}
function tierCls(p){return 't-'+(p.tier||(p.prem?'bronce':'none'))}
function ubic(p){const n=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[^a-z]/g,'');
  return p.barrio+' · '+p.city+(p.dept&&n(p.dept)!==n(p.city)?', '+p.dept:'')}
function filtersActive(){return !!(S.q||S.type||S.dept||S.city||S.barrio||S.max||S.beds||S.seller!==null||S.favOnly)}
function skeletonHTML(){return Array.from({length:8},()=>`<article class="pcard sk"><div class="pimg sk-b"></div><div class="pbody"><span class="sk-l w60"></span><span class="sk-l w90"></span><span class="sk-l w40"></span><div class="pactions"><span class="sk-b sk-btn"></span><span class="sk-b sk-btn"></span></div></div></article>`).join('')}
function premNavUpdate(){
  const tr=$('.prem-track'); if(!tr) return;
  const max=tr.scrollWidth-tr.clientWidth, x=tr.scrollLeft;
  const pv=$('[data-prem="-1"]'), nx=$('[data-prem="1"]');
  if(pv) pv.disabled = x<=4; if(nx) nx.disabled = x>=max-4;
  const bar=$('.prem-bar span');
  if(bar){const w=tr.scrollWidth?Math.min(1,tr.clientWidth/tr.scrollWidth):1;
    bar.style.width=(w*100)+'%'; bar.style.left=(max>0?(x/max)*(100-w*100):0)+'%'}
}
document.addEventListener('scroll',e=>{if(e.target.classList&&e.target.classList.contains('prem-track'))premNavUpdate()},true);
window.addEventListener('resize',premNavUpdate);
function cardsHTML(r){
  if(typeof LOADING!=='undefined' && LOADING) return skeletonHTML();
  const prem = S.view==='cards' ? r.filter(p=>p.prem).slice(0,10) : [];
  if(!prem.length || filtersActive()) return r.map((p,i)=>card(p,i)).join('');
  const shown = new Set(prem.map(p=>p.id));
  const rest = r.filter(p=>!shown.has(p.id));
  let h = `<section class="prem-wrap" aria-label="${t('prem_title')}">
    <div class="prem-orb o1"></div><div class="prem-orb o2"></div>
    <header class="prem-head"><div class="prem-crown"><i class="fa-solid fa-crown"></i></div>
      <div><h3>${t('prem_title')}</h3><p>${t('prem_sub')}</p></div>
      <div class="prem-right"><span class="prem-top"><i class="fa-solid fa-ranking-star"></i>${t('prem_top')}</span>
        <button class="prem-arrow" data-prem="-1" aria-label="←"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="prem-arrow" data-prem="1" aria-label="→"><i class="fa-solid fa-chevron-right"></i></button></div></header>
    <div class="prem-track" tabindex="0">${prem.map((p,i)=>card(p,i,i+1)).join('')}</div>
    <div class="prem-bar"><span></span></div></section>`;
  setTimeout(premNavUpdate,30);
  if(!rest.length) return h;
  if(!S.showAll) return h + `<div class="more-bar"><span>${t('more_hint')}</span><button class="btn-more" data-showall="1"><i class="fa-solid fa-chevron-down"></i>${t('see_more')} · ${rest.length}</button></div>`;
  return h + `<div class="rest-head"><span>${t('more_title')}</span></div><p class="rest-sub">${t('more_sub')}</p><div class="rest-grid${S._anim?' anim':''}">${rest.map((p,i)=>card(p,i)).join('')}</div>`;
}

function render(){
  const r = filtered();
  $('#count').textContent = `${r.length} ${t('n_found')}`;
  $('#cards').innerHTML = r.length? cardsHTML(r) : `<div class="empty"><i class="fa-regular fa-face-frown"></i><p>${t('no_results')}</p></div>`;
  $('#s1').textContent=P.length; $('#s2').textContent=new Set(P.map(p=>p.city)).size;
  $('#s3').textContent=SELLERS.length; $('#s4').textContent=P.filter(p=>p.ver).length;
  const chip=$('#sellerChip');
  if(S.seller!==null){chip.style.display='inline-flex';chip.innerHTML=`<i class="fa-solid fa-user"></i>${SELLERS[S.seller].name} <button id="chipX"><i class="fa-solid fa-xmark"></i></button>`}
  else chip.style.display='none';
  if(S.view==='map') renderMap(r);
}
function renderSellers(){
  $('#sellers').innerHTML = SELLERS.map((s,i)=>`<div class="scard">
    <div class="top"><div class="avatar">${s.ini}</div><div><h4>${s.name}</h4><small>${t(s.kind==='agency'?'agency':'person')} · ${P.filter(p=>p.seller===i).length} ${t('props_n')}</small>
    ${s.ver?`<div class="ver-tag"><i class="fa-solid fa-circle-check"></i> ${t('verified_seller')}</div>`:''}</div></div>
    <ul><li><i class="fa-solid fa-phone"></i>${s.phone}</li><li><i class="fa-solid fa-envelope"></i>${s.email}</li></ul>
    <button class="btn btn-ghost btn-sm" style="width:100%" data-seller="${i}"><i class="fa-solid fa-house"></i>${t('see_props')}</button></div>`).join('');
}

/* ============ mapa ============ */
function tileLayer(m){L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m)}
function renderMap(list){
  if(!map){map=L.map('mapView').setView([5.5,-74.5],6);tileLayer(map);mapLayer=L.layerGroup().addTo(map)}
  mapLayer.clearLayers();
  const pts=[];
  list.forEach(p=>{
    const m=L.marker([p.lat,p.lng]).addTo(mapLayer);
    m.bindPopup(`<b>${title(p)}</b><br>${cop(p.price)}${p.op==='arriendo'?t('per_month'):''}<br><a href="#" data-open="${p.id}" style="color:#6c3df5;font-weight:700">${t('details')} →</a>`);
    pts.push([p.lat,p.lng]);
  });
  setTimeout(()=>{map.invalidateSize();if(pts.length)map.fitBounds(pts,{padding:[40,40],maxZoom:12})},50);
}
function setView(v){
  S.view=v;
  $$('.seg button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  $('#cards').style.display=v==='cards'?'grid':'none';
  $('#mapView').style.display=v==='map'?'block':'none';
  render();
}

/* ============ detalle ============ */
function openDetail(id){
  const p=P.find(x=>x.id===id), s=SELLERS[p.seller], rent=p.op==='arriendo', fav=favs.includes(p.id);
  const d=DESC[p.type][LANGS.indexOf(lang)];
  $('#detailBody').innerHTML=`
  <div class="mhero" style="${imgStyle(p)}">${icon(p)}
    <div class="badges"><span class="b ${rent?'b-rent':'b-sale'}">${t(rent?'rental':'sale')}</span>
    ${p.ver?`<span class="b b-ver"><i class="fa-solid fa-circle-check"></i>${t('verified')}</span>`:''}
    ${p.prem?`<span class="b b-prem"><i class="fa-solid fa-star"></i>${t('premium')}</span>`:''}</div></div>
  <div class="mcols"><div>
    <div class="price" style="font-size:30px">${cop(p.price)}${rent?`<small> ${t('per_month')}</small>`:''}</div>
    <h2>${title(p)}</h2>
    <div class="loc"><i class="fa-solid fa-location-dot"></i>${p.addr} · ${ubic(p)}</div>
    <div class="specs" style="margin-top:14px">
      ${p.beds?`<span><i class="fa-solid fa-bed"></i>${p.beds} ${t('f_beds')}</span>`:''}
      ${p.baths?`<span><i class="fa-solid fa-bath"></i>${p.baths}</span>`:''}
      ${p.park?`<span><i class="fa-solid fa-car"></i>${p.park}</span>`:''}
      <span><i class="fa-solid fa-ruler-combined"></i>${p.area.toLocaleString('es-CO')} ${t('m2')}</span>
      ${p.estrato?`<span><i class="fa-solid fa-layer-group"></i>${t('estrato')} ${p.estrato}</span>`:''}</div>
    <h5>${t('description')}</h5><p>${d}</p>
    ${lang!=='es'?`<div class="note"><i class="fa-solid fa-language"></i>${t('auto_tr')}</div>`:''}
    <h5>${t('location')}</h5><div class="mapbox" id="dMap"></div>
  </div><div class="stack">
    <div class="sbox"><h5 style="margin:0 0 12px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em">${t('seller_info')}</h5>
      <div class="top"><div class="avatar" style="width:50px;height:50px">${s.ini}</div><div><b>${s.name}</b><br><small style="color:var(--muted)">${t(s.kind==='agency'?'agency':'person')}</small>
      ${s.ver?`<div class="ver-tag"><i class="fa-solid fa-circle-check"></i> ${t('verified_seller')}</div>`:''}</div></div>
      <div class="stack" style="font-size:13px;color:var(--muted)"><span><i class="fa-solid fa-phone" style="color:var(--primary);width:18px"></i>${s.phone}</span><span><i class="fa-solid fa-envelope" style="color:var(--primary);width:18px"></i>${s.email}</span></div>
      <a class="btn btn-ghost btn-sm" style="width:100%;margin-top:12px" href="tel:${s.phone.replace(/\s/g,'')}"><i class="fa-solid fa-phone"></i>${t('call')}</a></div>
    <div class="sbox"><h5 style="margin:0 0 12px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em">${t('contact_form')}</h5>
      <form id="leadForm" class="stack">
        <div class="field"><label>${t('name')} *</label><input name="n"></div>
        <div class="field"><label>${t('phone_mail')} *</label><input name="c"></div>
        <div class="field"><label>${t('message')}</label><textarea name="m" rows="2"></textarea></div>
        <button class="btn btn-primary btn-sm" type="submit"><i class="fa-solid fa-paper-plane"></i>${t('send')}</button></form></div>
    <button class="btn ${rent?'btn-orange':'btn-green'}" data-pay="${p.id}"><i class="fa-solid ${rent?'fa-key':'fa-cart-shopping'}"></i>${t(rent?'rent':'buy')} · PSE</button>
    <button class="btn btn-ghost" data-fav="${p.id}"><i class="${fav?'fa-solid':'fa-regular'} fa-heart" style="color:var(--red)"></i>${t('nav_favs')}</button>
  </div></div>`;
  openModal('#mDetail');
  setTimeout(()=>{ if(dmap){dmap.remove();dmap=null}
    dmap=L.map('dMap').setView([p.lat,p.lng],15);tileLayer(dmap);L.marker([p.lat,p.lng]).addTo(dmap).bindPopup(p.addr).openPopup();dmap.invalidateSize();},80);
  $('#leadForm').onsubmit=async e=>{e.preventDefault();const f=e.target;
    if(!f.n.value.trim()||!f.c.value.trim())return toast(t('req'));
    try{
      const r=await fetch(`${API}/leads`,{method:'POST',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({propiedad_id:p.id,nombre:f.n.value,contacto:f.c.value,mensaje:f.m.value})});
      if(r.ok){toast(t('sent_ok'));f.reset();}else{toast(t('req'));}
    }catch(_){toast(t('req'));}
  };
}

/* ============ PSE ============ */
function openPse(id){
  const p=P.find(x=>x.id===id), rent=p.op==='arriendo';
  $('#pseBody').innerHTML=`
    <span class="pse-logo"><i class="fa-solid fa-building-columns"></i> PSE</span>
    <h3 style="margin-top:14px">${t(rent?'pse_title_rent':'pse_title_buy')}</h3>
    <p style="color:var(--muted);font-size:13px">${t('pse_text')}</p>
    <div class="sum"><div><span>${t('property')}</span><b>${title(p)}</b></div><div><span>${t('location')}</span><b>${p.city}</b></div>
      <div><span>${t('amount')}</span><b style="color:var(--primary)">${cop(p.price)}</b></div></div>
    <form id="pseForm" class="stack">
      <div class="field"><label>${t('b_name')} *</label><input name="n"></div>
      <div class="field"><label>${t('b_mail')} *</label><input name="e" type="email"></div>
      <div class="field"><label>${t('b_doc')} *</label><input name="d"></div>
      <label class="chk"><input type="checkbox" name="ok"> ${t('consent')}</label>
      <button class="btn btn-primary" type="submit"><i class="fa-solid fa-lock"></i>${t('go_pse')}</button></form>`;
  openModal('#mPse');
  $('#pseForm').onsubmit=e=>{e.preventDefault();const f=e.target;
    if(!f.n.value.trim()||!f.e.value.trim()||!f.d.value.trim()||!f.ok.checked)return toast(t('req'));
    toast(t('redirecting'));
    const q=new URLSearchParams({propiedad:p.id,operacion:p.op,monto:p.price,nombre:f.n.value,correo:f.e.value,documento:f.d.value});
    setTimeout(()=>{ if(PSE_URL) window.location.href=PSE_URL+'?'+q; else {toast(t('demo_pse'));closeModals()} },1100);
  };
}

/* ============ modales / calculadora ============ */
function openModal(sel){$(sel).classList.add('open');document.body.style.overflow='hidden'}
function closeModals(){$$('.mbg').forEach(m=>m.classList.remove('open'));document.body.style.overflow='';if(dmap){dmap.remove();dmap=null}}
function calc(){
  const P0=+$('#cPrice').value, down=+$('#cDown').value/100, r=+$('#cRate').value/100/12, n=+$('#cYears').value*12;
  const loan=P0*(1-down); if(!loan||!n){$('#cOut').textContent='—';return}
  const m = r? loan*r/(1-Math.pow(1+r,-n)) : loan/n;
  $('#cOut').textContent=cop(Math.round(m));
}

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const g=s=>e.target.closest(s);
  let el;
  if(g('[data-fav]')){e.stopPropagation();const id=+g('[data-fav]').dataset.fav;
    favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];
    toast(t(favs.includes(id)?'fav_add':'fav_del'));
    try{localStorage.setItem('umbral_favs',JSON.stringify(favs))}catch(_){}
    render(); if($('#mDetail').classList.contains('open')) openDetail(id); return}
  if((el=g('[data-pay]'))){closeModals();openPse(+el.dataset.pay);return}
  if((el=g('[data-open]'))){e.preventDefault();closeModals();openDetail(+el.dataset.open);return}
  if((el=g('[data-seller]'))){S.seller=+el.dataset.seller;setView('cards');$('#filters').scrollIntoView({behavior:'smooth'});return}
  if((el=g('[data-prem]'))){const tr=$('.prem-track');if(tr)tr.scrollBy({left:+el.dataset.prem*tr.clientWidth*.8,behavior:'smooth'});return}
  if(g('[data-showall]')){S.showAll=true;S._anim=true;render();S._anim=false;const rh=$('.rest-head');if(rh)rh.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(g('#chipX')){S.seller=null;render();return}
  if((el=g('[data-op]'))){S.op=el.dataset.op;$$('.op').forEach(b=>b.classList.toggle('active',b===el));render();return}
  if((el=g('[data-view]'))){setView(el.dataset.view);return}
  if(g('[data-close]')||e.target.classList.contains('mbg')){closeModals();return}
  if((el=g('[data-nav]'))){
    const n=el.dataset.nav; $$('[data-nav]').forEach(a=>a.classList.toggle('active',a===el));
    $('#sidebar').classList.remove('open');$('#shade').classList.remove('open');
    if(n==='calc'){openModal('#mCalc');calc();return}
    if(n==='sellers'){$('#sellersAnchor').scrollIntoView({behavior:'smooth'});return}
    S.favOnly=n==='favs'; S.seller=null;
    if(n==='map'){setView('map');$('#filters').scrollIntoView({behavior:'smooth'});return}
    if(n==='venta'||n==='arriendo'||n==='all'){S.op=n;$$('.op').forEach(b=>b.classList.toggle('active',b.dataset.op===n))}
    setView('cards');return}
  if(g('#clearBtn')){Object.assign(S,{op:'all',type:'',dept:'',city:'',barrio:'',max:'',beds:'',q:'',sort:'rel',favOnly:false,seller:null,showAll:false});
    $('#q').value='';$('#fMax').value='';$$('.op').forEach(b=>b.classList.toggle('active',b.dataset.op==='all'));buildFilters();render();return}
  if(g('#goExplore')){$('#filters').scrollIntoView({behavior:'smooth'});return}
  if(g('#menuBtn')){$('#sidebar').classList.toggle('open');$('#shade').classList.toggle('open');return}
  if(g('#shade')){$('#sidebar').classList.remove('open');$('#shade').classList.remove('open')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals()});
$('#fType').onchange=e=>{S.type=e.target.value;render()};
$('#fDept').onchange=e=>{S.dept=e.target.value;S.city='';S.barrio='';buildFilters();render()};
$('#fCity').onchange=e=>{S.city=e.target.value;S.barrio='';buildFilters();render()};
$('#fBarrio').onchange=e=>{S.barrio=e.target.value;render()};
$('#fBeds').onchange=e=>{S.beds=e.target.value;render()};
$('#fSort').onchange=e=>{S.sort=e.target.value;render()};
$('#fMax').oninput=e=>{S.max=e.target.value;render()};
$('#q').oninput=e=>{S.q=e.target.value;render()};
$('#lang').onchange=e=>{lang=e.target.value;try{localStorage.setItem('umbral_lang',lang)}catch(_){}applyI18n()};
['cPrice','cDown','cRate','cYears'].forEach(i=>$('#'+i).oninput=calc);

/* tema claro / oscuro */
function setTheme(th){
  document.documentElement.dataset.theme=th;
  $('#themeBtn').innerHTML=`<i class="fa-solid ${th==='dark'?'fa-sun':'fa-moon'}"></i>`;
  try{localStorage.setItem('umbral_theme',th)}catch(_){}
}
$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme(localStorage.getItem('umbral_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

applyI18n();
loadData().then(applyI18n).catch(()=>toast('No se pudo conectar con el servidor; se muestran datos de ejemplo')).finally(()=>{window.__loadDone=true;window.__loading=false;LOADING=false;applyI18n()});
</script>
