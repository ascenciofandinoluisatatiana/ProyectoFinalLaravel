<!DOCTYPE html>
<html lang="es" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resultado del pago · Umbral</title>
    <link rel="icon" type="image/png" href="../img/icono.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../assets/admin/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="../assets/admin/fontawesome/css/solid.min.css">

    <!-- Mismo tema (día / noche) que eligió la persona en el portal o en su panel -->
    <script>
        try {
            var tema = localStorage.getItem('umbral-tema') || localStorage.getItem('umbral_theme');
            if (tema === 'dark' || tema === 'light') document.documentElement.setAttribute('data-theme', tema);
        } catch (e) {}
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        /* Dorado de la paleta: en noche es el acento; en día se usa un dorado más profundo para que se lea */
        :root, [data-theme="light"] { --oro: #9a7b1a; --sobre-boton: #ffffff; --halo: rgba(129, 37, 235, .18); --halo-2: rgba(212, 176, 98, .20); }
        [data-theme="dark"] { --oro: #e3c985; --sobre-boton: #14110a; --halo: rgba(124, 58, 237, .30); --halo-2: rgba(227, 201, 133, .10); }

        body {
            margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 28px 16px;
            font-family: var(--fuente-sans); color: var(--texto);
            background: var(--fondo-degradado); background-attachment: fixed;
            position: relative; overflow-x: hidden;
        }
        body::before, body::after { content: ""; position: fixed; z-index: 0; border-radius: 50%; filter: blur(70px); pointer-events: none; }
        body::before { width: 420px; height: 420px; top: -120px; left: -120px; background: var(--halo); }
        body::after  { width: 380px; height: 380px; bottom: -120px; right: -100px; background: var(--halo-2); }

        .r-caja { position: relative; z-index: 1; width: 100%; max-width: 540px; }
        .r-marca { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 22px; text-decoration: none; color: var(--texto); }
        .r-marca img { height: 40px; filter: var(--filtro-logo); }
        .r-marca b { letter-spacing: .38em; font-size: 1.05rem; }

        .r-tarjeta {
            position: relative; padding: 36px 30px 30px; text-align: center; display: grid; gap: 14px;
            background: var(--tarjeta); border: 1px solid var(--tarjeta-borde); border-radius: var(--radio-tarjeta);
            box-shadow: var(--sombra); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
            animation: entrada .5s ease both;
        }
        .r-tarjeta::before {
            content: ""; position: absolute; top: 0; left: 18%; right: 18%; height: 2px; border-radius: 2px;
            background: linear-gradient(90deg, transparent, var(--oro), transparent); opacity: .85;
        }
        @keyframes entrada { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

        .r-icono {
            position: relative; width: 88px; height: 88px; margin: 0 auto 6px; border-radius: 50%;
            display: grid; place-items: center; font-size: 1.9rem; color: var(--oro);
            background: var(--campo); border: 1.5px solid var(--tarjeta-borde);
        }
        .r-icono::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 1.5px solid var(--oro); opacity: .35; }
        .r-icono.aprobado { color: var(--sobre-boton); background: var(--boton-gradiente); border-color: transparent; }
        .r-icono.aprobado::before { opacity: .55; }
        .r-icono.pendiente::before, .r-icono.cargando::before { animation: onda 2.2s ease-out infinite; }
        .r-icono.fallo { color: var(--texto-suave); }
        .r-icono.fallo::before { border-style: dashed; opacity: .4; }
        @keyframes onda { 0% { transform: scale(.92); opacity: .6; } 100% { transform: scale(1.25); opacity: 0; } }

        .r-tarjeta h1 {
            margin: 0; font-family: var(--fuente-serif); font-weight: 600;
            font-size: clamp(1.8rem, 5vw, 2.3rem); line-height: 1.1; color: var(--texto);
        }
        .r-tarjeta > p { margin: 0; font-size: .95rem; line-height: 1.6; color: var(--texto-suave); }

        .r-datos { display: grid; gap: 0; margin-top: 4px; border-radius: 18px; border: 1px solid var(--campo-borde); background: var(--campo); text-align: left; font-size: .9rem; overflow: hidden; }
        .r-datos div { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 12px 16px; }
        .r-datos div + div { border-top: 1px solid var(--campo-borde); }
        .r-datos span { color: var(--texto-suave); }
        .r-datos b { text-align: right; overflow-wrap: anywhere; color: var(--texto); }
        .r-datos div:nth-child(2) b { color: var(--oro); font-size: 1.02rem; }

        .r-acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
        .v-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px 26px; border-radius: 14px; border: 1.5px solid transparent;
            font: 700 .98rem var(--fuente-sans); text-decoration: none; cursor: pointer;
            transition: transform .15s, box-shadow .2s;
        }
        .v-btn:hover { transform: translateY(-1px); }
        .v-btn:focus-visible { outline: 2px solid var(--oro); outline-offset: 3px; }
        .v-btn-principal { background: var(--boton-gradiente); color: var(--sobre-boton); box-shadow: 0 10px 26px var(--halo); }
        .r-nota {
            margin: 0; padding: 9px 14px; border-radius: 12px; border: 1px dashed var(--campo-borde);
            font-size: .78rem; color: var(--texto-suave);
        }

        @media (max-width: 480px) {
            body { padding: 16px 12px; }
            .r-tarjeta { padding: 28px 18px 24px; }
            .r-acciones .v-btn { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <main class="r-caja">
        <a class="r-marca" href="../index.html"><img src="../img/icono.png" alt=""><b>UMBRAL</b></a>
        <section class="r-tarjeta" id="r-tarjeta" aria-live="polite">
            <div class="r-icono cargando"><i class="fa-solid fa-spinner fa-spin"></i></div>
            <h1>Consultando tu pago…</h1>
            <p>Estamos confirmando el resultado con la pasarela de pagos.</p>
        </section>
    </main>

    <script>
    /* =========================================================
       Resultado de un pago (Wompi o simulado).
       Wompi devuelve aquí con ?id=TRANSACCION; el modo simulado con ?ref=REFERENCIA.
       El estado real SIEMPRE lo consulta el servidor (GET /api/v1/public/pagos/estado),
       nunca se confía en lo que diga la URL.
       ========================================================= */
    (function () {
        'use strict';

        var parametros = new URLSearchParams(window.location.search);
        var id = parametros.get('id');
        var ref = parametros.get('ref');
        var intentos = 0;
        var caja = document.getElementById('r-tarjeta');

        var TEXTOS = {
            aprobado: { icono: 'fa-check', clase: 'aprobado', titulo: '¡Pago aprobado!', texto: 'Tu pago quedó registrado correctamente.' },
            pendiente: { icono: 'fa-hourglass-half', clase: 'pendiente', titulo: 'Pago en proceso', texto: 'Tu banco aún no confirma el pago. Esta página se actualiza sola.' },
            rechazado: { icono: 'fa-xmark', clase: 'fallo', titulo: 'Pago rechazado', texto: 'El pago no fue aprobado. No se hizo ningún cobro; puedes intentarlo de nuevo.' },
            anulado: { icono: 'fa-ban', clase: 'fallo', titulo: 'Pago anulado', texto: 'La transacción fue anulada.' },
            error: { icono: 'fa-triangle-exclamation', clase: 'fallo', titulo: 'No se pudo completar', texto: 'Hubo un problema con el pago. Si se hizo un cobro, comunícate con soporte con la referencia.' }
        };

        function esc(t) {
            return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function cop(n) {
            return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(Number(n) || 0);
        }

        function pintar(d) {
            var t = TEXTOS[d.estado] || TEXTOS.pendiente;
            var extra = d.estado === 'aprobado'
                ? (d.concepto === 'membresia' ? ' Tu membresía ya está activa.' : ' El vendedor recibió tus datos y se comunicará contigo.')
                : '';
            caja.innerHTML =
                '<div class="r-icono ' + t.clase + '"><i class="fa-solid ' + t.icono + '"></i></div>' +
                '<h1>' + t.titulo + '</h1>' +
                '<p>' + esc(t.texto + extra) + '</p>' +
                '<div class="r-datos">' +
                    '<div><span>Concepto</span><b>' + esc(d.detalle) + '</b></div>' +
                    '<div><span>Valor</span><b>' + cop(d.monto) + '</b></div>' +
                    '<div><span>Medio de pago</span><b>' + esc(d.metodo || '—') + '</b></div>' +
                    '<div><span>Referencia</span><b>' + esc(d.referencia) + '</b></div>' +
                '</div>' +
                '<div class="r-acciones"><a class="v-btn v-btn-principal" href="' + esc(d.volver) + '"><i class="fa-solid fa-arrow-left"></i> Volver</a></div>' +
                (d.simulado ? '<p class="r-nota">Pago simulado: el servidor no tiene llaves de Wompi configuradas.</p>' : '');
        }

        function fallo(mensaje) {
            var t = TEXTOS.error;
            caja.innerHTML =
                '<div class="r-icono ' + t.clase + '"><i class="fa-solid ' + t.icono + '"></i></div>' +
                '<h1>No encontramos el pago</h1><p>' + esc(mensaje) + '</p>' +
                '<div class="r-acciones"><a class="v-btn v-btn-principal" href="/index.html"><i class="fa-solid fa-house"></i> Ir al inicio</a></div>';
        }

        async function consultar() {
            if (!id && !ref) { fallo('El enlace no tiene la información del pago.'); return; }
            intentos++;
            try {
                var q = id ? 'id=' + encodeURIComponent(id) : 'ref=' + encodeURIComponent(ref);
                var r = await fetch('/api/v1/public/pagos/estado?' + q, { headers: { 'Accept': 'application/json' } });
                var json = await r.json().catch(function () { return {}; });
                if (!r.ok) { fallo(json.message || 'Intenta de nuevo en un momento.'); return; }

                pintar(json.data);
                // Pendiente (por ejemplo PSE esperando al banco): se vuelve a consultar por 2 minutos
                if (json.data.estado === 'pendiente' && intentos < 24) {
                    ref = json.data.referencia; id = null;
                    setTimeout(consultar, 5000);
                }
            } catch (e) {
                fallo('No hay conexión con el servidor. Recarga la página.');
            }
        }
        consultar();
    })();
    </script>
</body>
</html>
