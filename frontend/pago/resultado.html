<!DOCTYPE html>
<html lang="es" dir="ltr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resultado del pago · Umbral</title>
    <link rel="icon" type="image/png" href="/img/icono.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/solid.min.css">
    <link rel="stylesheet" href="/vendedor/css/vendedor.css">
    <link rel="stylesheet" href="/inmobiliaria/css/inmobiliaria.css">

    <!-- Mismo tema que eligió la persona en el portal o en su panel -->
    <script>
        try {
            var tema = localStorage.getItem('umbral-tema') || localStorage.getItem('umbral_theme');
            if (tema === 'dark' || tema === 'light') document.documentElement.setAttribute('data-theme', tema);
        } catch (e) {}
    </script>
    <style>
        .r-caja { max-width: 560px; margin: clamp(32px, 10vh, 90px) auto; padding: 0 16px; }
        .r-marca { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 22px; text-decoration: none; color: var(--texto); }
        .r-marca img { height: 44px; }
        [data-theme="dark"] .r-marca img { filter: brightness(1.9) saturate(1.1); }
        .r-marca b { letter-spacing: 0.35em; font-size: 1.05rem; }
        .r-tarjeta { padding: 34px 28px; text-align: center; display: grid; gap: 14px; }
        .r-icono { width: 72px; height: 72px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 1.9rem; color: #fff; }
        .r-icono.aprobado { background: linear-gradient(135deg, #0f9d6b, #34d399); }
        .r-icono.pendiente { background: linear-gradient(135deg, #b7791f, #fbbf24); }
        .r-icono.fallo { background: linear-gradient(135deg, #d6455d, #fb7185); }
        .r-icono.cargando { background: linear-gradient(135deg, var(--op-1), var(--op-2)); }
        .r-tarjeta h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.1; }
        .r-tarjeta > p { color: var(--texto-suave); }
        .r-datos { display: grid; gap: 8px; padding: 16px; border-radius: 16px; background: var(--neutro-fondo); text-align: left; font-size: 0.9rem; }
        .r-datos div { display: flex; justify-content: space-between; gap: 12px; }
        .r-datos span { color: var(--texto-suave); }
        .r-datos b { text-align: right; overflow-wrap: anywhere; }
        .r-acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px; }
        .r-nota { font-size: 0.78rem; color: var(--texto-suave); }
    </style>
</head>
<body class="vendedor op-venta">
    <main class="r-caja">
        <a class="r-marca" href="/index.html"><img src="/img/icono.png" alt=""><b>UMBRAL</b></a>
        <section class="v-tarjeta r-tarjeta" id="r-tarjeta" aria-live="polite">
            <div class="r-icono cargando"><i class="fa-solid fa-spinner fa-spin"></i></div>
            <h1 class="titulo-serif">Consultando tu pago…</h1>
            <p>Estamos confirmando el resultado con la pasarela de pagos.</p>
        </section>
    </main>

    <script>
    /* =========================================================
       Resultado de un pago (Wompi o simulado).
       Wompi devuelve aquí con ?id=TRANSACCION; el modo simulado con ?ref=REFERENCIA.
       El estado real SIEMPRE lo consulta el servidor (GET /api/v1/public/pagos/estado),
       nunca se confía en lo que diga la URL.
       ========================================================= */
    (function () {
        'use strict';

        var parametros = new URLSearchParams(window.location.search);
        var id = parametros.get('id');
        var ref = parametros.get('ref');
        var intentos = 0;
        var caja = document.getElementById('r-tarjeta');

        var TEXTOS = {
            aprobado: { icono: 'fa-check', clase: 'aprobado', titulo: '¡Pago aprobado!', texto: 'Tu pago quedó registrado correctamente.' },
            pendiente: { icono: 'fa-hourglass-half', clase: 'pendiente', titulo: 'Pago en proceso', texto: 'Tu banco aún no confirma el pago. Esta página se actualiza sola.' },
            rechazado: { icono: 'fa-xmark', clase: 'fallo', titulo: 'Pago rechazado', texto: 'El pago no fue aprobado. No se hizo ningún cobro; puedes intentarlo de nuevo.' },
            anulado: { icono: 'fa-ban', clase: 'fallo', titulo: 'Pago anulado', texto: 'La transacción fue anulada.' },
            error: { icono: 'fa-triangle-exclamation', clase: 'fallo', titulo: 'No se pudo completar', texto: 'Hubo un problema con el pago. Si se hizo un cobro, comunícate con soporte con la referencia.' }
        };

        function esc(t) {
            return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function cop(n) {
            return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(Number(n) || 0);
        }

        function pintar(d) {
            var t = TEXTOS[d.estado] || TEXTOS.pendiente;
            var extra = d.estado === 'aprobado'
                ? (d.concepto === 'membresia' ? ' Tu membresía ya está activa.' : ' El vendedor recibió tus datos y se comunicará contigo.')
                : '';
            caja.innerHTML =
                '<div class="r-icono ' + t.clase + '"><i class="fa-solid ' + t.icono + '"></i></div>' +
                '<h1 class="titulo-serif">' + t.titulo + '</h1>' +
                '<p>' + esc(t.texto + extra) + '</p>' +
                '<div class="r-datos">' +
                    '<div><span>Concepto</span><b>' + esc(d.detalle) + '</b></div>' +
                    '<div><span>Valor</span><b>' + cop(d.monto) + '</b></div>' +
                    '<div><span>Medio de pago</span><b>' + esc(d.metodo || '—') + '</b></div>' +
                    '<div><span>Referencia</span><b>' + esc(d.referencia) + '</b></div>' +
                '</div>' +
                '<div class="r-acciones"><a class="v-btn v-btn-principal" href="' + esc(d.volver) + '"><i class="fa-solid fa-arrow-left"></i> Volver</a></div>' +
                (d.simulado ? '<p class="r-nota">Pago simulado: el servidor no tiene llaves de Wompi configuradas.</p>' : '');
        }

        function fallo(mensaje) {
            var t = TEXTOS.error;
            caja.innerHTML =
                '<div class="r-icono ' + t.clase + '"><i class="fa-solid ' + t.icono + '"></i></div>' +
                '<h1 class="titulo-serif">No encontramos el pago</h1><p>' + esc(mensaje) + '</p>' +
                '<div class="r-acciones"><a class="v-btn v-btn-principal" href="/index.html"><i class="fa-solid fa-house"></i> Ir al inicio</a></div>';
        }

        async function consultar() {
            if (!id && !ref) { fallo('El enlace no tiene la información del pago.'); return; }
            intentos++;
            try {
                var q = id ? 'id=' + encodeURIComponent(id) : 'ref=' + encodeURIComponent(ref);
                var r = await fetch('/api/v1/public/pagos/estado?' + q, { headers: { 'Accept': 'application/json' } });
                var json = await r.json().catch(function () { return {}; });
                if (!r.ok) { fallo(json.message || 'Intenta de nuevo en un momento.'); return; }

                pintar(json.data);
                // Pendiente (por ejemplo PSE esperando al banco): se vuelve a consultar por 2 minutos
                if (json.data.estado === 'pendiente' && intentos < 24) {
                    ref = json.data.referencia; id = null;
                    setTimeout(consultar, 5000);
                }
            } catch (e) {
                fallo('No hay conexión con el servidor. Recarga la página.');
            }
        }
        consultar();
    })();
    </script>
</body>
</html>
