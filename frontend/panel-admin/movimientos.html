<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movimientos · UMBRAL</title>
    <link rel="icon" type="image/png" href="/img/icono.png">

    <!-- Aplica el tema guardado ANTES de pintar la página (evita el parpadeo) -->
    <script>
        (function () {
            var tema = 'light';
            try {
                var guardado = localStorage.getItem('umbral-tema');
                if (guardado === 'dark' || guardado === 'light') tema = guardado;
            } catch (e) {}
            document.documentElement.setAttribute('data-theme', tema);
        })();
    </script>

    <!-- Fuente del panel: la misma del dashboard de invitado -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/admin/admin.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/solid.min.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/regular.min.css">
    <link rel="stylesheet" href="/assets/admin/tema.css">

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--ad-borde); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--ad-borde2); }
        html[data-theme="dark"] input[type="date"] { color-scheme: dark; }
        html[data-theme="light"] input[type="date"] { color-scheme: light; }
        .filtros-mov { display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:10px; }
        .filtros-mov .ancho { grid-column: span 2; }
        .filtros-mov [hidden] { display:none !important; }
        @media (max-width: 480px) { .filtros-mov .ancho { grid-column: auto; } }
        .campo-fecha { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color: var(--ad-muted, #a1a1aa); }
        .campo-fecha input { min-width:0; }
        /* Pestañas (mismo estilo que Verificaciones: Pendientes / Historial) */
        .mov-pestanas { display:flex; gap:.25rem; border-bottom:1px solid var(--ad-borde); overflow-x:auto; white-space:nowrap; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
        .mov-pestanas::-webkit-scrollbar { display:none; }
        .mov-pestana { display:inline-flex; align-items:center; gap:.5rem; padding:.7rem 1.1rem; margin-bottom:-1px; font-size:.875rem; font-weight:600; color:var(--ad-muted); background:transparent; border:0; border-bottom:2px solid transparent; cursor:pointer; transition:all .15s ease; flex:0 0 auto; }
        .mov-pestana:hover { color:var(--ad-text); }
        .mov-pestana.activa { color:var(--ad-primary); border-bottom-color:var(--ad-primary2); }
        .mov-pestana .cuenta { min-width:22px; padding:1px 7px; border-radius:999px; font-size:11px; font-weight:800; text-align:center; background:var(--ad-soft); color:var(--ad-primary); }
        .mov-sub { padding:0 .75rem; border-bottom:1px solid var(--ad-borde); }
        .mov-sub .mov-pestana { font-size:.8rem; padding:.6rem .9rem; }
        .fila-dia td { padding:7px 20px; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; background:var(--ad-soft); color:var(--ad-primary); }
        .tabla-mov td { padding-top:9px; padding-bottom:9px; }
        .tabla-mov .det-movil { display:none; }
        .vacio-mov { padding:48px 20px; text-align:center; }
        .vacio-mov .icono { margin:0 auto 14px; display:grid; place-items:center; width:48px; height:48px; border-radius:14px; background:var(--ad-soft); color:var(--ad-primary); }

        /* Celular: cada registro es una tarjetita sin desbordes (nada se corta ni se desliza) */
        @media (max-width: 900px) {
            .tabla-mov { min-width:0 !important; display:block; font-size:13px; }
            .tabla-mov thead { display:none; }
            .tabla-mov tbody { display:block; }
            .tabla-mov tr.fila-mov { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:12px 14px; border-bottom:1px solid var(--ad-borde); }
            .tabla-mov tr.fila-mov td { display:block; padding:0 !important; min-width:0; }
            .tabla-mov td.c-usuario { order:1; flex:1 1 100%; }
            .tabla-mov td.c-accion  { order:2; }
            .tabla-mov td.c-rol     { order:3; }
            .tabla-mov td.c-detalle { order:4; flex:1 1 100%; font-size:12px; overflow-wrap:anywhere; }
            .tabla-mov td.c-hora    { order:5; font-size:12px; }
            .tabla-mov td.c-ip      { order:6; font-size:12px; }
            .tabla-mov td.c-hora::before { content:"\1F552  "; }
            .tabla-mov td.c-ip::before   { content:"IP  "; font-weight:700; }
            .tabla-mov tr.fila-dia { display:block; }
            .tabla-mov tr.fila-dia td { display:block; padding:7px 14px !important; }
            .mov-pestana { padding:.65rem .85rem; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased" data-pagina="movimientos" data-titulo="Movimientos">

    <div id="app" class="min-h-screen" style="visibility:hidden">
        <div id="zona-menu"></div>

        <div class="flex min-h-screen flex-col lg:pl-72 transition-all duration-300">
            <div id="zona-barra"></div>

            <main class="flex-1 px-4 py-6 sm:px-6 lg:px-8">
                <div class="mx-auto max-w-7xl space-y-5">

                    <!-- Encabezado de la sección -->
                    <div class="hero-admin relative overflow-hidden rounded-2xl border border-slate-800 p-6 sm:p-8">
                        <span class="hero-blob hero-blob-1"></span>
                        <span class="hero-blob hero-blob-2"></span>

                        <div class="relative">
                            <p class="text-xs font-semibold uppercase tracking-wider text-violet-400">
                                <i class="fa-solid fa-clock-rotate-left mr-1"></i>Historial
                            </p>
                            <h1 class="titulo-grad mt-1 text-2xl font-extrabold sm:text-3xl">Movimientos</h1>
                            <p class="mt-1.5 max-w-xl text-sm text-slate-400">
                                Qué pasó en el portal: seguridad de las cuentas, inicios de sesión y lo que hacen inmobiliarias, agentes y vendedores.
                            </p>
                        </div>
                    </div>

                    <!-- Pestañas principales -->
                    <div id="pestanas" class="mov-pestanas" role="tablist">
                        <button type="button" role="tab" data-tab="seguridad"    class="mov-pestana"><i class="fa-solid fa-shield-halved"></i>Seguridad<span class="cuenta" data-cuenta="seguridad">–</span></button>
                        <button type="button" role="tab" data-tab="inmobiliaria" class="mov-pestana"><i class="fa-solid fa-building"></i>Inmobiliarias<span class="cuenta" data-cuenta="inmobiliaria">–</span></button>
                        <button type="button" role="tab" data-tab="agente"       class="mov-pestana"><i class="fa-solid fa-user-tie"></i>Agentes<span class="cuenta" data-cuenta="agente">–</span></button>
                        <button type="button" role="tab" data-tab="vendedor"     class="mov-pestana"><i class="fa-solid fa-store"></i>Vendedores<span class="cuenta" data-cuenta="vendedor">–</span></button>
                    </div>

                    <!-- Tarjeta con el submenú y la tabla de la pestaña elegida -->
                    <div class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/60 shadow-xl shadow-black/20">
                        <div id="subpestanas" class="mov-pestanas mov-sub" role="tablist"></div>
                        <div id="secciones"></div>
                    </div>
                </div>
            </main>

            <footer class="border-t border-slate-800/60 px-6 py-4 text-xs text-slate-600 flex flex-wrap items-center justify-between gap-2">
                <span>UMBRAL · El paso hacia un nuevo hogar</span>
                <span>Panel de administración · Colombia</span>
            </footer>
        </div>

        <!-- Aviso de error -->
        <div id="contenedor-toasts" class="fixed right-4 top-4 z-[60] flex w-80 flex-col gap-2.5"></div>
    </div>

    <!-- Fondo oscurecido detrás del menú móvil -->
    <div id="fondo-menu" class="fixed inset-0 z-30 hidden bg-black/60 backdrop-blur-sm lg:hidden transition-opacity duration-300"></div>

    <script src="js/panel-admin.js"></script>
    <script src="js/movimientos.js"></script>
</body>
</html>
