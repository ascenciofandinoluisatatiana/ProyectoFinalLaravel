<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movimientos · UMBRAL</title>
    <link rel="icon" type="image/png" href="/img/icono.png">

    <!-- Aplica el tema guardado ANTES de pintar la página (evita el parpadeo) -->
    <script>
        (function () {
            var tema = 'light';
            try {
                var guardado = localStorage.getItem('umbral-tema');
                if (guardado === 'dark' || guardado === 'light') tema = guardado;
            } catch (e) {}
            document.documentElement.setAttribute('data-theme', tema);
        })();
    </script>

    <!-- Fuente del panel: la misma del dashboard de invitado -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/admin/admin.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/solid.min.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/regular.min.css">
    <link rel="stylesheet" href="/assets/admin/tema.css">

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--ad-borde); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--ad-borde2); }
        html[data-theme="dark"] input[type="date"] { color-scheme: dark; }
        html[data-theme="light"] input[type="date"] { color-scheme: light; }
        .filtros-mov { display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:10px; }
        .filtros-mov .ancho { grid-column: span 2; }
        .filtros-mov [hidden] { display:none !important; }
        @media (max-width: 480px) { .filtros-mov .ancho { grid-column: auto; } }
        .campo-fecha { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color: var(--ad-muted, #a1a1aa); }
        .campo-fecha input { min-width:0; }
        /* Pestañas (mismo estilo que Verificaciones: Pendientes / Historial) */
        .mov-pestanas { display:flex; gap:.25rem; border-bottom:1px solid var(--ad-borde); overflow-x:auto; white-space:nowrap; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
        .mov-pestanas::-webkit-scrollbar { display:none; }
        .mov-pestana { display:inline-flex; align-items:center; gap:.5rem; padding:.7rem 1.1rem; margin-bottom:-1px; font-size:.875rem; font-weight:600; color:var(--ad-muted); background:transparent; border:0; border-bottom:2px solid transparent; cursor:pointer; transition:all .15s ease; flex:0 0 auto; }
        .mov-pestana:hover { color:var(--ad-text); }
        .mov-pestana.activa { color:var(--ad-primary); border-bottom-color:var(--ad-primary2); }
        .mov-pestana .cuenta { min-width:22px; padding:1px 7px; border-radius:999px; font-size:11px; font-weight:800; text-align:center; background:var(--ad-soft); color:var(--ad-primary); }
        .mov-sub { padding:0 .75rem; border-bottom:1px solid var(--ad-borde); }
        .mov-sub .mov-pestana { font-size:.8rem; padding:.6rem .9rem; }
        .fila-dia td { padding:7px 20px; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; background:var(--ad-soft); color:var(--ad-primary); }
        .tabla-mov td { padding-top:9px; padding-bottom:9px; }
        .tabla-mov .det-movil { display:none; }
        .vacio-mov { padding:48px 20px; text-align:center; }
        .vacio-mov .icono { margin:0 auto 14px; display:grid; place-items:center; width:48px; height:48px; border-radius:14px; background:var(--ad-soft); color:var(--ad-primary); }

        /* La tabla de Movimientos nunca fuerza un ancho mínimo (en celular cada registro es una tarjetita) */
        html .overflow-x-auto > table.tabla-mov { min-width: 0 !important; }
        /* Celular: las pestañas bajan de renglón en vez de deslizarse, así no se corta ninguna letra */
        @media (max-width: 640px) {
            .mov-pestanas { flex-wrap: wrap; overflow-x: visible; white-space: normal; }
            .mov-pestana { flex: 1 1 auto; justify-content: center; text-align: center; white-space: normal; line-height: 1.2; padding: .6rem .6rem; }
            #pestanas .mov-pestana { flex-basis: 45%; font-size: .78rem; padding: .6rem .35rem; gap: .35rem; }
            #pestanas .mov-pestana > i { display: none; }
            .mov-sub { padding: 0; }
        }


        /* Invitados: números dentro de la tarjetita y ventana "Ver" */
        .tabla-mov td.c-ver { text-align:right; }
        .btn-ver { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:10px; border:1px solid var(--ad-borde2); background:transparent; color:var(--ad-primary); font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; transition:all .15s ease; }
        .btn-ver:hover { background:var(--ad-soft); }
        .tabla-mov td .nota { display:block; font-size:12px; color:var(--ad-muted); }
        .modal-inv { position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; padding:14px; background:rgba(0,0,0,.6); backdrop-filter:blur(3px); }
        .modal-inv[hidden] { display:none; }
        .modal-inv-caja { width:100%; max-width:720px; max-height:calc(100vh - 28px); overflow-y:auto; border-radius:18px; border:1px solid var(--ad-borde); background:var(--ad-card); box-shadow:0 25px 60px rgba(0,0,0,.45); }
        .modal-inv-cab { position:sticky; top:0; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:16px 18px; border-bottom:1px solid var(--ad-borde); background:var(--ad-card); }
        .modal-inv-cuerpo { padding:16px 18px 20px; display:grid; gap:14px; }
        .inv-id { display:flex; align-items:center; gap:12px; min-width:0; }
        .inv-avatar { flex:none; width:44px; height:44px; border-radius:14px; display:grid; place-items:center; font-weight:800; color:#fff; background:linear-gradient(135deg,#8b5cf6,#6366f1); }
        .inv-tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
        .inv-tile { padding:12px 10px; border-radius:14px; background:var(--ad-soft); text-align:center; min-width:0; }
        .inv-tile b { display:block; font-size:22px; line-height:1.1; color:var(--ad-primary); }
        .inv-tile small { display:block; margin-top:3px; font-size:11px; color:var(--ad-muted); }
        .inv-chips { display:flex; flex-wrap:wrap; gap:6px; }
        .inv-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; border:1px solid var(--ad-borde); font-size:12px; color:var(--ad-muted); max-width:100%; }
        .inv-chip b { color:var(--ad-text); font-weight:600; overflow-wrap:anywhere; }
        .inv-tabs { display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--ad-borde); }
        .inv-tab { display:inline-flex; align-items:center; gap:6px; padding:8px 12px; margin-bottom:-1px; font-size:13px; font-weight:600; color:var(--ad-muted); background:transparent; border:0; border-bottom:2px solid transparent; cursor:pointer; }
        .inv-tab:hover { color:var(--ad-text); }
        .inv-tab.activa { color:var(--ad-primary); border-bottom-color:var(--ad-primary2); }
        .inv-tab .cuenta { min-width:20px; padding:0 6px; border-radius:999px; font-size:11px; font-weight:800; text-align:center; background:var(--ad-soft); color:var(--ad-primary); }
        .inv-buscar { width:100%; padding:8px 12px; border-radius:12px; border:1px solid var(--ad-borde); background:transparent; color:var(--ad-text); font-size:13px; outline:none; }
        .inv-buscar:focus { border-color:var(--ad-primary2); }
        .inv-lista { display:grid; gap:8px; }
        .inv-item { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px; border:1px solid var(--ad-borde); min-width:0; }
        .inv-item .ico { flex:none; width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:var(--ad-soft); color:var(--ad-primary); }
        .inv-item .cuerpo { flex:1; min-width:0; }
        .inv-item .cuerpo b { display:block; font-size:13px; overflow-wrap:anywhere; }
        .inv-item .cuerpo small { display:block; font-size:12px; color:var(--ad-muted); overflow-wrap:anywhere; }
        .inv-item .der { flex:none; font-size:12px; color:var(--ad-muted); text-align:right; max-width:35%; }
        .inv-pag { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--ad-muted); }
        .inv-pag .botones { display:flex; gap:4px; }
        .inv-pag button { min-width:30px; height:30px; padding:0 8px; border-radius:8px; border:1px solid var(--ad-borde); background:transparent; color:var(--ad-text); font-size:12px; cursor:pointer; }
        .inv-pag button.activa { background:var(--ad-primary2); color:#fff; border-color:transparent; }
        .inv-pag button:disabled { opacity:.4; cursor:not-allowed; }
        .inv-vacio { padding:26px 10px; text-align:center; font-size:13px; color:var(--ad-muted); }
        @media (max-width:480px) {
            .inv-tiles { grid-template-columns:repeat(2,1fr); }
            .inv-tab { flex:1 1 calc(50% - 4px); justify-content:center; padding:8px 6px; }
            .inv-item .der { max-width:none; }
            .inv-item { flex-wrap:wrap; }
        }
        .btn-cerrar { flex:none; width:34px; height:34px; border-radius:10px; border:1px solid var(--ad-borde); background:transparent; color:var(--ad-muted); cursor:pointer; }
        .btn-cerrar:hover { color:var(--ad-text); background:var(--ad-soft); }

        /* Celular: cada registro es una tarjetita sin desbordes (nada se corta ni se desliza) */
        @media (max-width: 900px) {
            .tabla-mov td.c-stat   { order:2; font-size:12px; }
            .tabla-mov td.c-stat::before { content:attr(data-et) ": "; color:var(--ad-muted); }
            .tabla-mov td.c-fecha  { order:5; font-size:12px; }
            .tabla-mov td.c-ver    { order:7; margin-left:auto; }
            .tabla-mov { min-width:0 !important; display:block; font-size:13px; }
            .tabla-mov thead { display:none; }
            .tabla-mov tbody { display:block; }
            .tabla-mov tr.fila-mov { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:12px 14px; border-bottom:1px solid var(--ad-borde); }
            .tabla-mov tr.fila-mov td { display:block; padding:0 !important; min-width:0; }
            .tabla-mov td.c-usuario { order:1; flex:1 1 100%; }
            .tabla-mov td.c-accion  { order:2; }
            .tabla-mov td.c-rol     { order:3; }
            .tabla-mov td.c-detalle { order:4; flex:1 1 100%; font-size:12px; overflow-wrap:anywhere; }
            .tabla-mov td.c-hora    { order:5; font-size:12px; }
            .tabla-mov td.c-ip      { order:6; font-size:12px; }
            .tabla-mov td.c-hora::before { content:"\1F552  "; }
            .tabla-mov td.c-ip::before   { content:"IP  "; font-weight:700; }
            .tabla-mov tr.fila-dia { display:block; }
            .tabla-mov tr.fila-dia td { display:block; padding:7px 14px !important; }
            .mov-pestana { padding:.65rem .85rem; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased" data-pagina="movimientos" data-titulo="Movimientos">

    <div id="app" class="min-h-screen" style="visibility:hidden">
        <div id="zona-menu"></div>

        <div class="flex min-h-screen flex-col lg:pl-72 transition-all duration-300">
            <div id="zona-barra"></div>

            <main class="flex-1 px-4 py-6 sm:px-6 lg:px-8">
                <div class="mx-auto max-w-7xl space-y-5">

                    <!-- Encabezado de la sección -->
                    <div class="hero-admin relative overflow-hidden rounded-2xl border border-slate-800 p-6 sm:p-8">
                        <span class="hero-blob hero-blob-1"></span>
                        <span class="hero-blob hero-blob-2"></span>

                        <div class="relative">
                            <p class="text-xs font-semibold uppercase tracking-wider text-violet-400">
                                <i class="fa-solid fa-clock-rotate-left mr-1"></i>Historial
                            </p>
                            <h1 class="titulo-grad mt-1 text-2xl font-extrabold sm:text-3xl">Movimientos</h1>
                            <p class="mt-1.5 max-w-xl text-sm text-slate-400">
                                Qué pasó en el portal: seguridad de las cuentas, inicios de sesión, lo que hacen inmobiliarias, agentes y vendedores, y los visitantes sin cuenta.
                            </p>
                        </div>
                    </div>

                    <!-- Pestañas principales -->
                    <div id="pestanas" class="mov-pestanas" role="tablist">
                        <button type="button" role="tab" data-tab="seguridad"    class="mov-pestana"><i class="fa-solid fa-shield-halved"></i>Seguridad<span class="cuenta" data-cuenta="seguridad">–</span></button>
                        <button type="button" role="tab" data-tab="administrador" class="mov-pestana"><i class="fa-solid fa-user-shield"></i>Administradores<span class="cuenta" data-cuenta="administrador">–</span></button>
                        <button type="button" role="tab" data-tab="inmobiliaria" class="mov-pestana"><i class="fa-solid fa-building"></i>Inmobiliarias<span class="cuenta" data-cuenta="inmobiliaria">–</span></button>
                        <button type="button" role="tab" data-tab="agente"       class="mov-pestana"><i class="fa-solid fa-user-tie"></i>Agentes<span class="cuenta" data-cuenta="agente">–</span></button>
                        <button type="button" role="tab" data-tab="vendedor"     class="mov-pestana"><i class="fa-solid fa-store"></i>Vendedores<span class="cuenta" data-cuenta="vendedor">–</span></button>
                        <button type="button" role="tab" data-tab="invitado"     class="mov-pestana"><i class="fa-solid fa-user-group"></i>Invitados<span class="cuenta" data-cuenta="invitado">–</span></button>
                    </div>

                    <!-- Tarjeta con el submenú y la tabla de la pestaña elegida -->
                    <div class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/60 shadow-xl shadow-black/20">
                        <div id="subpestanas" class="mov-pestanas mov-sub" role="tablist"></div>
                        <div id="secciones"></div>
                    </div>
                </div>
            </main>

            <footer class="border-t border-slate-800/60 px-6 py-4 text-xs text-slate-600 flex flex-wrap items-center justify-between gap-2">
                <span>UMBRAL · El paso hacia un nuevo hogar</span>
                <span>Panel de administración · Colombia</span>
            </footer>
        </div>

        <!-- Aviso de error -->
        <div id="contenedor-toasts" class="fixed right-4 top-4 z-[60] flex w-80 flex-col gap-2.5"></div>
    </div>

    <!-- Fondo oscurecido detrás del menú móvil -->
    <div id="fondo-menu" class="fixed inset-0 z-30 hidden bg-black/60 backdrop-blur-sm lg:hidden transition-opacity duration-300"></div>

    <!-- Ventana "Ver" de un visitante -->
    <div id="modal-inv" class="modal-inv" hidden role="dialog" aria-modal="true" aria-labelledby="modal-inv-titulo">
        <div class="modal-inv-caja">
            <div class="modal-inv-cab">
                <div class="inv-id"><span class="inv-avatar" id="modal-inv-avatar"><i class="fa-solid fa-user"></i></span><div class="min-w-0"><h2 id="modal-inv-titulo" class="text-lg font-extrabold" style="overflow-wrap:anywhere;line-height:1.2"></h2><p id="modal-inv-sub" class="text-xs" style="color:var(--ad-muted);overflow-wrap:anywhere"></p></div></div>
                <button type="button" class="btn-cerrar" id="modal-inv-cerrar" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-inv-cuerpo" class="modal-inv-cuerpo"></div>
        </div>
    </div>

    <script src="js/panel-admin.js"></script>
    <script src="js/movimientos.js"></script>
</body>
</html>
