<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movimientos · UMBRAL</title>
    <link rel="icon" type="image/png" href="/img/icono.png">

    <!-- Aplica el tema guardado ANTES de pintar la página (evita el parpadeo) -->
    <script>
        (function () {
            var tema = 'light';
            try {
                var guardado = localStorage.getItem('umbral-tema');
                if (guardado === 'dark' || guardado === 'light') tema = guardado;
            } catch (e) {}
            document.documentElement.setAttribute('data-theme', tema);
        })();
    </script>

    <!-- Fuente del panel: la misma del dashboard de invitado -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/admin/admin.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/solid.min.css">
    <link rel="stylesheet" href="/assets/admin/fontawesome/css/regular.min.css">
    <link rel="stylesheet" href="/assets/admin/tema.css">

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--ad-borde); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--ad-borde2); }
        html[data-theme="dark"] input[type="date"] { color-scheme: dark; }
        html[data-theme="light"] input[type="date"] { color-scheme: light; }
        .filtros-mov { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
        .filtros-mov .ancho { grid-column: span 2; }
        .campo-fecha { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color: var(--ad-muted, #a1a1aa); }
        .campo-fecha input { min-width:0; }
        .filtros-mov .hidden { display:none; }
        @media (max-width: 480px) { .filtros-mov .ancho { grid-column: auto; } }
        .pestana-mov { display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:12px; font-size:14px; font-weight:600;
                       color: var(--ad-text2, #94a3b8); border:1px solid transparent; background:transparent; cursor:pointer; transition:all .15s; }
        .pestana-mov:hover { background: rgba(148,163,184,.12); }
        .pestana-mov.activa { color:#fff; background: linear-gradient(90deg,#7c3aed,#4f46e5); box-shadow:0 6px 16px rgba(124,58,237,.28); }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased" data-pagina="movimientos" data-titulo="Movimientos">

    <div id="app" class="min-h-screen" style="visibility:hidden">
        <div id="zona-menu"></div>

        <div class="flex min-h-screen flex-col lg:pl-72 transition-all duration-300">
            <div id="zona-barra"></div>

            <main class="flex-1 px-4 py-6 sm:px-6 lg:px-8">
                <div class="mx-auto max-w-7xl space-y-5">

                    <!-- Encabezado de la sección -->
                    <div class="hero-admin relative overflow-hidden rounded-2xl border border-slate-800 p-6 sm:p-8">
                        <span class="hero-blob hero-blob-1"></span>
                        <span class="hero-blob hero-blob-2"></span>

                        <div class="relative">
                            <p class="text-xs font-semibold uppercase tracking-wider text-violet-400">
                                <i class="fa-solid fa-clock-rotate-left mr-1"></i>Historial
                            </p>
                            <h1 class="titulo-grad mt-1 text-2xl font-extrabold sm:text-3xl">Movimientos</h1>
                            <p class="mt-1.5 max-w-xl text-sm text-slate-400">
                                Qué pasó en el portal: la seguridad de las cuentas y lo que hacen inmobiliarias, agentes y vendedores.
                            </p>
                        </div>
                    </div>

                    <div class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/60 shadow-xl shadow-black/20">

                        <!-- Pestañas -->
                        <div id="pestanas" class="flex flex-wrap gap-1.5 border-b border-slate-800 p-3">
                            <button type="button" data-tab="seguridad"    class="pestana-mov"><i class="fa-solid fa-shield-halved"></i>Seguridad</button>
                            <button type="button" data-tab="inmobiliaria" class="pestana-mov"><i class="fa-solid fa-building"></i>Inmobiliarias</button>
                            <button type="button" data-tab="agente"       class="pestana-mov"><i class="fa-solid fa-user-tie"></i>Agentes</button>
                            <button type="button" data-tab="vendedor"     class="pestana-mov"><i class="fa-solid fa-store"></i>Vendedores</button>
                        </div>

                        <!-- Filtros -->
                        <div class="filtros-mov border-b border-slate-800 p-4">
                            <div class="relative ancho">
                                <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-sm text-slate-500"></i>
                                <input type="search" id="buscar" placeholder="Buscar por nombre o correo…"
                                       class="w-full rounded-xl border border-slate-800 bg-slate-950/60 py-2.5 pl-10 pr-4 text-sm text-slate-200 placeholder-slate-600 outline-none transition-all focus:border-violet-500/60 focus:ring-2 focus:ring-violet-500/20">
                            </div>
                            <select id="filtro-accion" class="w-full rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2.5 text-sm text-slate-300 outline-none transition-all focus:border-violet-500/60 focus:ring-2 focus:ring-violet-500/20"><option value="">Acción: Todas</option></select>
                            <select id="filtro-rol" class="w-full rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2.5 text-sm text-slate-300 outline-none transition-all focus:border-violet-500/60 focus:ring-2 focus:ring-violet-500/20">
                                <option value="">Rol: Todos</option>
                                <option value="administrador">Administrador</option>
                                <option value="inmobiliaria">Inmobiliaria</option>
                                <option value="agente">Agente</option>
                                <option value="vendedor">Vendedor</option>
                            </select>
                            <label class="campo-fecha"><span>Desde</span><input type="date" id="filtro-desde" class="w-full rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2.5 text-sm text-slate-300 outline-none transition-all focus:border-violet-500/60 focus:ring-2 focus:ring-violet-500/20"></label>
                            <label class="campo-fecha"><span>Hasta</span><input type="date" id="filtro-hasta" class="w-full rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2.5 text-sm text-slate-300 outline-none transition-all focus:border-violet-500/60 focus:ring-2 focus:ring-violet-500/20"></label>
                            <input type="text" id="filtro-ip" placeholder="IP (ej: 190.25.)" autocomplete="off" aria-label="Dirección IP" class="w-full rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2.5 text-sm text-slate-300 outline-none transition-all focus:border-violet-500/60 focus:ring-2 focus:ring-violet-500/20">
                            <select id="filtro-orden" aria-label="Orden" class="w-full rounded-xl border border-slate-800 bg-slate-950/60 px-3 py-2.5 text-sm text-slate-300 outline-none transition-all focus:border-violet-500/60 focus:ring-2 focus:ring-violet-500/20">
                                <option value="reciente">Más recientes primero</option>
                                <option value="antiguo">Más antiguos primero</option>
                            </select>
                            <button type="button" id="limpiar"
                                    class="rounded-xl border border-slate-700 px-4 py-2.5 text-sm font-medium text-slate-300 transition-all hover:bg-slate-800">
                                <i class="fa-solid fa-filter-circle-xmark mr-1.5"></i>Limpiar filtros<span id="contador-filtros" class="ml-1.5 hidden rounded-full bg-violet-500/20 px-2 py-0.5 text-[11px] font-bold text-violet-300"></span>
                            </button>
                        </div>

                        <!-- Tabla -->
                        <div class="overflow-x-auto">
                            <table class="w-full min-w-[48rem] text-left text-sm">
                                <thead class="border-b border-slate-800 text-[11px] uppercase tracking-wider text-slate-500">
                                    <tr>
                                        <th class="px-5 py-3.5 font-semibold">Fecha</th>
                                        <th class="px-5 py-3.5 font-semibold">Usuario</th>
                                        <th class="px-5 py-3.5 font-semibold">Acción</th>
                                        <th class="px-5 py-3.5 font-semibold">Detalle</th>
                                        <th class="px-5 py-3.5 font-semibold">IP</th>
                                    </tr>
                                </thead>
                                <tbody id="tabla-mov" class="divide-y divide-slate-800/70 transition-opacity"></tbody>
                            </table>
                        </div>

                        <!-- Sin resultados -->
                        <div id="tabla-vacia" class="hidden px-5 py-14 text-center">
                            <div class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-xl bg-slate-800 text-slate-500"><i class="fa-solid fa-inbox"></i></div>
                            <p id="vacio-titulo" class="text-sm font-medium text-slate-400"></p>
                            <p id="vacio-texto" class="mx-auto mt-0.5 max-w-md text-xs text-slate-600"></p>
                        </div>

                        <!-- Paginación -->
                        <div class="flex flex-wrap items-center justify-between gap-3 border-t border-slate-800 px-5 py-3.5">
                            <p id="paginacion-info" class="text-xs text-slate-500"></p>
                            <div id="paginacion-botones" class="flex items-center gap-1"></div>
                        </div>
                    </div>
                </div>
            </main>

            <footer class="border-t border-slate-800/60 px-6 py-4 text-xs text-slate-600 flex flex-wrap items-center justify-between gap-2">
                <span>UMBRAL · El paso hacia un nuevo hogar</span>
                <span>Panel de administración · Colombia</span>
            </footer>
        </div>

        <!-- Aviso de error -->
        <div id="contenedor-toasts" class="fixed right-4 top-4 z-[60] flex w-80 flex-col gap-2.5"></div>
    </div>

    <!-- Fondo oscurecido detrás del menú móvil -->
    <div id="fondo-menu" class="fixed inset-0 z-30 hidden bg-black/60 backdrop-blur-sm lg:hidden transition-opacity duration-300"></div>

    <script src="js/panel-admin.js"></script>
    <script src="js/movimientos.js"></script>
</body>
</html>
