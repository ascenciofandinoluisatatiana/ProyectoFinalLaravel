<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva contraseña · Umbral</title>
    <link rel="icon" type="image/png" href="/img/icono.png">

    <!-- Tema guardado (misma clave que el resto del sitio). Sin tema guardado empieza en oscuro. -->
    <script>
        (function () {
            var tema = 'dark';
            try {
                var guardado = localStorage.getItem('umbral-tema');
                if (guardado === 'dark' || guardado === 'light') tema = guardado;
            } catch (e) {}
            document.documentElement.setAttribute('data-theme', tema);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root, html[data-theme="dark"] {
            --fondo: #0b0810; --tarjeta: #121016; --texto: #ffffff; --suave: #a1a1aa;
            --borde: #2a2433; --campo: #0b0810; --oro1: #e8c860; --oro2: #b8902a; --sobre-oro: #1a1206;
            --ok: #34d399; --error: #f87171; color-scheme: dark;
        }
        html[data-theme="light"] {
            --fondo: #faf7ff; --tarjeta: #ffffff; --texto: #1a1026; --suave: #6b6280;
            --borde: #e9ddf7; --campo: #faf7ff; --oro1: #9333ea; --oro2: #7e22ce; --sobre-oro: #ffffff;
            --ok: #047857; --error: #b91c1c; color-scheme: light;
        }
        * { box-sizing: border-box; }
        html { scrollbar-gutter: stable; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--texto);
            background: radial-gradient(900px 500px at 80% -10%, color-mix(in srgb, var(--oro1) 14%, transparent), transparent 60%), var(--fondo);
        }
        .caja {
            width: 100%; max-width: 440px; padding: 34px 30px; border-radius: 22px;
            background: var(--tarjeta); border: 1px solid var(--borde);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
        }
        .marca { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
        .marca img { height: 44px; width: auto; }
        .marca strong { display: block; letter-spacing: .35em; font-size: 1.05rem; }
        .marca em { display: block; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: .95rem; color: var(--oro1); }
        .titulo { margin: 0 0 6px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 2rem; font-weight: 600; line-height: 1.15; }
        .sub { margin: 0 0 22px; color: var(--suave); font-size: .95rem; line-height: 1.5; }
        .etiqueta { display: block; margin: 14px 0 6px; font-size: .85rem; font-weight: 600; }
        .campo {
            display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 48px;
            border-radius: 12px; border: 1px solid var(--borde); background: var(--campo);
            transition: border-color .2s, box-shadow .2s;
        }
        .campo:focus-within { border-color: var(--oro1); box-shadow: 0 0 0 3px color-mix(in srgb, var(--oro1) 22%, transparent); }
        .campo svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--suave); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .campo input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--texto); font: inherit; font-size: .95rem; }
        .campo input::placeholder { color: var(--suave); opacity: .8; }
        .ojo { border: 0; background: transparent; cursor: pointer; padding: 4px; display: grid; place-items: center; }
        .mensaje { margin: 16px 0 0; padding: 11px 14px; border-radius: 12px; font-size: .88rem; font-weight: 600; line-height: 1.4; border: 1px solid; }
        .mensaje[hidden] { display: none; }
        .mensaje.error { color: var(--error); border-color: color-mix(in srgb, var(--error) 40%, transparent); background: color-mix(in srgb, var(--error) 10%, transparent); }
        .mensaje.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
        .boton {
            display: inline-flex; align-items: center; justify-content: center; width: 100%; margin-top: 22px; height: 50px;
            border: 0; border-radius: 12px; cursor: pointer; text-decoration: none;
            font: inherit; font-weight: 800; letter-spacing: .08em; font-size: .9rem;
            color: var(--sobre-oro); background: linear-gradient(135deg, var(--oro1), var(--oro2));
            transition: transform .15s, filter .2s;
        }
        .boton:hover { filter: brightness(1.08); }
        .boton:active { transform: scale(.98); }
        .boton:disabled { opacity: .6; cursor: not-allowed; }
        .listo { text-align: center; }
        .listo[hidden] { display: none; }
        .listo .icono { width: 64px; height: 64px; margin: 4px auto 14px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--ok) 14%, transparent); }
        .listo .icono svg { width: 30px; height: 30px; fill: none; stroke: var(--ok); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
        .listo p { margin: 0; color: var(--suave); line-height: 1.5; }
        .listo .icono-error { background: color-mix(in srgb, var(--error) 14%, transparent); }
        .listo .icono-error svg { stroke: var(--error); }
        form[hidden] { display: none; }

        /* Barra de desplazamiento fina: dorada en noche, morada en día */
        html::-webkit-scrollbar, html ::-webkit-scrollbar { width: 12px; height: 12px; }
        html::-webkit-scrollbar-track, html ::-webkit-scrollbar-track { background: transparent; }
        html::-webkit-scrollbar-thumb, html ::-webkit-scrollbar-thumb { background: var(--oro1); background-clip: padding-box; border: 4px solid transparent; border-radius: 999px; }
        html::-webkit-scrollbar-thumb:hover, html ::-webkit-scrollbar-thumb:hover { border-width: 2px; }
    </style>
</head>
<body data-pagina="restablecer">
    <main class="caja">
        <div class="marca">
            <img src="/img/icono.png" alt="Umbral">
            <span>
                <strong>UMBRAL</strong>
                <em data-i18n="marca.eslogan">El paso hacia un nuevo hogar.</em>
            </span>
        </div>

        <form id="form-restablecer" novalidate>
            <h1 class="titulo" data-i18n="restablecer.titulo">Elige tu nueva contraseña</h1>
            <p class="sub" data-i18n="restablecer.sub">Escribe una contraseña nueva para tu cuenta.</p>

            <label class="etiqueta" for="nueva" data-i18n="restablecer.nueva">Nueva contraseña</label>
            <div class="campo">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                <input type="password" id="nueva" placeholder="Mínimo 8 caracteres" data-i18n-placeholder="reg.clave_ph" autocomplete="new-password">
                <button type="button" class="ojo" data-ver="nueva" aria-label="Mostrar u ocultar contraseña" data-i18n-aria="login.ver_clave">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <label class="etiqueta" for="confirmar" data-i18n="reg.clave2">Confirmar contraseña</label>
            <div class="campo">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                <input type="password" id="confirmar" placeholder="Repite tu contraseña" data-i18n-placeholder="reg.clave2_ph" autocomplete="new-password">
                <button type="button" class="ojo" data-ver="confirmar" aria-label="Mostrar u ocultar contraseña" data-i18n-aria="login.ver_clave">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>

            <p class="mensaje" id="mensaje" role="alert" hidden></p>
            <button type="submit" class="boton"><span data-i18n="restablecer.guardar">GUARDAR CONTRASEÑA</span></button>
        </form>

        <div class="listo" id="bloque-listo" hidden>
            <div class="icono"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
            <h1 class="titulo" data-i18n="restablecer.ok_titulo">¡Listo!</h1>
            <p data-i18n="restablecer.ok">Cambiamos tu contraseña. Ya puedes iniciar sesión.</p>
            <a class="boton" href="/index.html?login=1" data-i18n="restablecer.ir_login">Iniciar sesión</a>
        </div>

        <div class="listo" id="bloque-invalido" hidden>
            <div class="icono icono-error"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></div>
            <p data-i18n="restablecer.enlace_invalido">El enlace no es válido o ya venció. Pide uno nuevo desde el inicio de sesión.</p>
            <a class="boton" href="/index.html?login=1" data-i18n="restablecer.ir_login">Iniciar sesión</a>
        </div>
    </main>

    <script src="/js/i18n.js"></script>
    <script src="/js/restablecer.js"></script>
</body>
</html>
